/* ---------- Attendance ---------- */
const ATT_AWAY = ['UL','AL','NPL','MC','RS','MA','CL','ML','PPL','PSPL','HL','CCL','OIL','Course','ICT','Others'];
// attendance message lines, in this order (all shown, NIL when no one): [line label, status]; LIB Test / IPPT come from the weekly tab rows
const ATT_MSG = [['AL','AL'],['UL','UL'],['HL','HL'],['CL','CL'],['ML','ML'],['RS','RS'],['MC','MC'],['MA','MA'],['OIL','OIL'],['CCL','CCL'],['ICT','ICT'],
  ['PPL','PPL'],['PSPL','PSPL'],['Course','Course'],['LIB Test','@LIB Test'],['IPPT / TRG etc','@IPPT / TRG etc'],['OTHERS','Others']];
const ATT_RANGE = ['AL','NPL','MC','HL','ML','PPL','PSPL'];   // picked with From / To dates (saved as a leave record)
const ATT_LABEL = { AL:'Annual Leave', NPL:'No Pay Leave', MC:'Medical Certificate', HL:'Hospitalisation Leave', RS:'Report Sick', MA:'Medical Appointment', CL:'Compassionate Leave', ML:'Maternity Leave', PPL:'Paid Paternity Leave', PSPL:'Paid Shared Parental Leave' };
const ATT_RNA = 'Reserve Not Activated';          // weekend / PH reserve (duty spare) not called in: goes under Not Deployed
const ATT_REASON = ['MC','RS'];                   // statuses that carry a reason (shown in the attendance message)
const MON_ATT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sept','Oct','Nov','Dec'];
const DAYL = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const titleCase = n => n.toLowerCase().replace(/(^|[\s(\/-])([a-z])/g, (m, a, c) => a + c.toUpperCase());
function attText(a){
  const d = pd(a.date);
  const rows = a.rows.filter(r => r.status !== 'Off');
  const list = arr => arr.length ? arr.length + ' - ' + arr.map(r => titleCase(r.name)).join(', ') : 'NIL';
  const by = st => rows.filter(r => r.status === st);
  /* a leave line: everyone whose status is that leave, plus anyone with a second half-day leave of that kind; (AM)/(PM) shown for half days */
  const half = h => h ? ' (' + h + ')' : '';
  /* reporting later today (PM shift, OTHERS "... 1200HRS", EXT range):
     marked Present -> their own line with the report time; not marked yet -> under Others with the time */
  const grp = list0 => { const g = {}; list0.forEach(r => { (g[r.ext] = g[r.ext] || []).push(titleCase(r.name)); }); return g; };
  const laterIn = rows.filter(r => r.ext && r.status === 'Present');
  const later = rows.filter(r => r.ext && !r.status);
  const laterLines = () => { const g = grp(laterIn);
    return Object.keys(g).sort().map(t => 'Present (Report ' + hrs(t) + '): ' + g[t].length + ' - ' + g[t].join(', ')); };
  const laterTxt = () => { const g = grp(later); return Object.keys(g).sort().map(t => g[t].join(', ') + ' (Report ' + hrs(t) + ')'); };
  const leaveList = c => {
    const out = [];
    rows.forEach(r => {
      if (r.status === c) out.push(titleCase(r.name) + half(r.leave && r.leave.cat === c ? r.leave.half : '') + (ATT_REASON.includes(c) && r.reason ? ' (' + r.reason + ')' : ''));
      (r.leave && r.leave.also || []).forEach(x => { if (x.cat === c && r.status !== c) out.push(titleCase(r.name) + half(x.half)); });
    });
    const n = out.length + (c === 'Others' ? later.length : 0);
    if (c === 'Others') out.push.apply(out, laterTxt());
    return n ? n + ' - ' + out.join(', ') : 'NIL';
  };
  /* AL, UL, HL ... OTHERS lines (all shown, NIL when no one) */
  const awayLines = () => ATT_MSG.map(([lb, c]) => {
    if (c[0] === '@') { const ns = ((a.plan || {})[c.slice(1)] || []); return lb + ': ' + (ns.length ? ns.length + ' - ' + ns.map(titleCase).join(', ') : 'NIL'); }
    let v = leaveList(c);
    if (c === 'Others') {                              // NPL (no-pay leave) goes under OTHERS
      const npl = rows.filter(r => r.status === 'NPL').map(r => titleCase(r.name) + ' (NPL)');
      if (npl.length) { const m = /^(\d+) - (.*)$/.exec(v); v = m ? (+m[1] + npl.length) + ' - ' + m[2] + ', ' + npl.join(', ') : npl.length + ' - ' + npl.join(', '); }
    }
    return lb + ': ' + v;
  });
  const present = rows.filter(r => r.status === 'Present' || r.status === 'Present (Late)');
  const head2 = ['*OPS SUPPORT*',
    '*Date: ' + d.getDate() + ' ' + MON_ATT[d.getMonth()] + ' ' + d.getFullYear() + ' (' + DAYL[dowIdx(a.date)] + ')*',
    'Total strength: ' + rows.length];
  if (dowIdx(a.date) >= 5) {
    // Weekend: only who is turning up, Managers first (JAMES LAI first), then APO, then Medics
    const ORD = { Manager:0, 'DY Manager':0.5, 'APO Supervisor':1, APO:1, 'Non-APO':1, Medic:2, 'Medic Certis':2 };
    const ppl = present.slice().sort((x, y) => ((ORD[x.role] ?? 3) - (ORD[y.role] ?? 3)) ||
      ((y.name === 'JAMES LAI') - (x.name === 'JAMES LAI')) || x.name.localeCompare(y.name));
    // all present names in one line, then the same AL / MC / ... lines as on weekdays,
    // then (after a blank line) who is not deployed: no status (or marked Off) and not reporting later
    const sorted = arr => arr.slice().sort((x, y) => ((ORD[x.role] ?? 3) - (ORD[y.role] ?? 3)) ||
      ((y.name === 'JAMES LAI') - (x.name === 'JAMES LAI')) || x.name.localeCompare(y.name));
    const notDep = sorted(rows.filter(r => (!r.status || r.status === ATT_RNA) && !r.ext));   // incl. the reserve not called in
    return head2.concat(['Present: ' + (ppl.length ? ppl.length + ' - ' + ppl.map(r => titleCase(r.name)).join(', ') : 'NIL'), ''], awayLines(),
      ['', 'Not Deployed: ' + list(notDep)]).join('\n');
  }
  const L = [
    '*OPS SUPPORT*',
    '*Date: ' + d.getDate() + ' ' + MON_ATT[d.getMonth()] + ' ' + d.getFullYear() + ' (' + DAYL[dowIdx(a.date)] + ')*',
    'Total strength: ' + rows.length,
    'Present: ' + present.length,
    'Present (Late): ' + (by('Present (Late)').length ? by('Present (Late)').length + ' - ' + by('Present (Late)').map(r => titleCase(r.name) + (r.ext ? ' (Report ' + hrs(r.ext) + ')' : '')).join(', ') : 'NIL')].concat(laterLines(), [
    ''
  ]);
  L.push.apply(L, awayLines());
  const rna = by(ATT_RNA);
  if (rna.length) L.push('', 'Reserve Not Activated: ' + list(rna));
  const none = rows.filter(r => !r.status && !r.ext);
  if (none.length) L.push('Not accounted: ' + list(none));
  return L.join('\n');
}

function dropNameTxt(text, n){
  const out = [];
  String(text || '').split(/\s*\/\s*/).filter(Boolean).forEach(part => {
    if (!namesIn(part).includes(n)) { out.push(part); return; }
    const m = /\(\s*(AM|PM)\b[^)]*\)/i.exec(part), who = (m ? part.replace(m[0], ' ') : part).replace(/\s+/g, ' ').trim();
    const keep = who.split(/\s*(?:&|,|\bAND\b)\s*/i).filter(x => x && !namesIn(x).includes(n));
    if (keep.length) out.push(keep.join(' & ') + (m ? ' ' + m[0] : '')); else if (m && m[1].toUpperCase() === 'AM') out.push('NA ' + m[0]);
  });

}

/* Spacing tidy-up (free, done here): no spaces at line ends, single spaces between words,
   at most one blank line between sections, nothing blank at the start or end. Returns { text, n fixes } */
function tidySpacing(text){
  let n = 0;
  const count = (re, s) => (s.match(re) || []).length;
  let t = String(text).replace(/\r\n?/g, '\n');
  n += count(/[ \t]+$/gm, t);           t = t.replace(/[ \t]+$/gm, '');
  n += count(/(\S)[ \t]{2,}(?=\S)/g, t); t = t.replace(/(\S)[ \t]{2,}(?=\S)/g, '$1 ');
  n += count(/ +([,.;:!?])(?=\s|$)/g, t); t = t.replace(/ +([,.;:!?])(?=\s|$)/g, '$1');
  n += count(/\n{3,}/g, t);             t = t.replace(/\n{3,}/g, '\n\n');
  const trimmed = t.replace(/^\s+|\s+$/g, ''); if (trimmed !== t) n++; t = trimmed;
  return { text: t, n };
}

    document.body.appendChild(bg);
    const done = v => { bg.remove(); res(v); };
    $('#gc-x', bg).onclick = () => done(null);

/* Small confirm box: resolves with read(bg) (or true) on Confirm, null on Cancel */
function askBox(title, body, ok, read){
  if (isPD()) { toast(RO_MSG, true); return Promise.resolve(null); }
  return new Promise(res => {
    const bg = document.createElement('div');
    bg.className = 'sheet-bg';
    bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><h3>${title}</h3><div class="src" style="font-size:15px;color:var(--ink)">${body}</div>
      <div class="yn"><button class="btn ghost" id="ab-n">Cancel</button><button class="btn go" id="ab-y">${ok || 'Confirm'}</button></div></div>`;
    document.body.appendChild(bg);
    const done = v => { bg.remove(); res(v); };
    $('#ab-y', bg).onclick = () => { try { done(read ? read(bg) : true); } catch(m){ toast(String(m), true); } };
    $('#ab-n', bg).onclick = () => done(null);
    bg.onclick = e => { if (e.target === bg) done(null); };
    const f = bg.querySelector('input'); if (f) f.focus();
  });
}
const fullDate = d => nice(d) + ' ' + pd(d).getFullYear();
const hhmmTxt = t => t ? ', ' + t + 'hrs' : '';
function drawLib(list){
  const days = d => d ? Math.round((pd(d) - pd(S.today)) / 864e5) : null;
  const pill = x => {
    const n = days(x.date);
    if (n == null) return '<span class="pill Cancelled">No date</span>';
    if (n < 0) return '<span class="pill Rejected">Expired</span>';
    if (n <= 45) return `<span class="pill Pending">${n} day${n === 1 ? '' : 's'} left</span>`;
    return '<span class="pill Approved">Valid</span>';
  };
  list = list.slice().sort((a, b) => (a.date || '9999') < (b.date || '9999') ? -1 : 1);
  const have = list.map(x => x.name);
  const missing = (S.staff || []).filter(p => (APO_LIKE.includes(p.role) || MGR_ROLES.includes(p.role)) && !have.includes(p.name)).map(p => p.name).sort();
  const late = list.filter(x => days(x.date) != null && days(x.date) < 0).length;
  const need = list.filter(x => !x.arranged && days(x.date) != null && days(x.date) <= 45).length;
  const card = x => {
    const editing = S.libEdit === x.name;
    const n = days(x.date);
    const cls = x.arranged ? 'arr' : n != null && n <= 45 ? 'need' : '';
    let next;
    if (x.arranged && !editing) {
      const due = x.arranged <= S.today;
      next = `<div class="larr"><span>Next LIB test</span><b>${esc(fullDate(x.arranged))}${esc(hhmmTxt(x.time))}</b>${due ? '<em>Mark Attended once done</em>' : ''}</div>
        <div class="lbtns"><button class="btn go" data-lat="${esc(x.name)}">Attended</button><button class="btn ghost" data-lre="${esc(x.name)}">Reschedule</button></div>`;
    } else {
      next = `<div class="lpick"><label><span>Next LIB test date</span><input type="date" min="${S.today}" data-ld="${esc(x.name)}" value="${esc(editing ? x.arranged : '')}"></label>
          <label><span>Time (24hrs)</span><input type="text" inputmode="numeric" maxlength="4" placeholder="XXXX" data-lt="${esc(x.name)}" value="${esc(editing ? x.time : '')}"></label></div>
        <div class="lbtns"><button class="btn" data-larr="${esc(x.name)}">Arrange</button><button class="btn ghost" data-lclr="${esc(x.name)}">${editing ? 'Back' : 'Clear'}</button></div>
        ${editing ? `<button class="linkbtn" data-lcancel="${esc(x.name)}" style="margin-top:6px">Cancel this LIB test</button>` : ''}`;
    }
    return `<div class="libc ${cls}"><div class="lh"><b>${esc(x.label)}</b>${pill(x)}${!x.arranged && n != null && n <= 45 ? '<span class="pill Rejected">Not arranged</span>' : ''}</div>
      <div class="small muted">Expires ${x.date ? esc(fullDate(x.date)) : '-'}${x.date ? ' &middot; last test ' + esc(fullDate(addMonths(x.date, -LIB_MONTHS))) : ''}</div>
      <div class="lnext">${next}</div>
      <div class="lmore"><button class="linkbtn" data-lfix="${esc(x.name)}">Correct last test date</button><button class="linkbtn" data-librm="${x.row}" data-libname="${esc(x.name)}">Remove from list</button></div></div>`;
  };
  A().innerHTML = `
    <p class="small muted">LIB is valid for six months from the test date. Arrange the next test, then mark it <b>Attended</b>: the new expiry is saved in the <b>Database</b> tab (column H), which the LIB EXPIRY list on every weekly tab reads.</p>
    ${late ? `<div class="note red">${late} LIB${late === 1 ? ' has' : 's have'} expired.</div>` : ''}${need ? `<div class="note yellow">${need} need${need === 1 ? 's' : ''} a LIB test arranged (expired or expiring within 45 days).</div>` : ''}
    ${list.map(card).join('')}
    <div class="sec" style="margin-top:16px"><h3 style="margin-top:0">Add someone to the LIB list</h3>
      ${missing.length ? `<label class="f"><span>Name</span><select id="l-n"><option value="">Choose a name</option>${missing.map(n => `<option>${esc(n)}</option>`).join('')}</select></label>
      <label class="f"><span>Date they last took the LIB test</span><input type="date" id="l-d" max="${S.today}"></label>
      <p class="small muted" id="l-x" style="margin-top:-8px"></p>
      <button class="btn" id="l-go">Add to LIB list</button>` : '<p class="muted">Every APO and manager is already on the list.</p>'}</div>`;
  const okT = v => /^([01][0-9]|2[0-3])[0-5][0-9]$/.test(v);
  const run = async (fn, btn, msg) => { if (btn) busy(btn, true); try { const r = await fn(); S.libEdit = ''; drawLib(r.list || r); if (r.warn) toast(r.warn, true); else if (msg) toast(msg); } catch(x){ fail(x); if (btn) busy(btn, false); } };

    if (!d) return toast('Pick the date of the LIB test.', true);
    if (d < S.today) return toast('Pick today or a later date.', true);
    if (!okT(t)) return toast('Key in the time as 24hrs, e.g. 0900.', true);

    const ok = await askBox(x.arranged ? 'Reschedule LIB test?' : 'Arrange LIB test?',

    if (ok) run(() => call('adminArrangeLib', S.token, n, d, t), b, 'LIB test arranged: ' + x.label + ', ' + nice(d) + ' ' + t + 'hrs');
  });
  A().querySelectorAll('[data-lclr]').forEach(b => b.onclick = () => {
    if (S.libEdit === b.dataset.lclr) { S.libEdit = ''; drawLib(list); return; }
    A().querySelector(`[data-ld="${b.dataset.lclr}"]`).value = ''; A().querySelector(`[data-lt="${b.dataset.lclr}"]`).value = '';
  });
  A().querySelectorAll('[data-lre]').forEach(b => b.onclick = () => { S.libEdit = b.dataset.lre; drawLib(list); });
  A().querySelectorAll('[data-lcancel]').forEach(b => b.onclick = async () => {

    const ok = await askBox('Confirm LIB test attended?', `<b style="font-size:17px">${esc(x.label)}</b><br>${esc(fullDate(x.arranged))}${esc(hhmmTxt(x.time))}<br>New LIB expiry: <b>${esc(fullDate(addMonths(x.arranged, LIB_MONTHS)))}</b>`);
    if (ok) run(() => call('adminLibAttended', S.token, x.name), b, 'Attended. ' + x.label + "'s LIB now expires " + fullDate(addMonths(x.arranged, LIB_MONTHS)));

  A().querySelectorAll('[data-lfix]').forEach(b => b.onclick = async () => {
    const x = find(b.dataset.lfix);
    const d = await askBox('Correct last LIB test date', `<b>${esc(x.label)}</b><label class="f" style="margin-top:10px"><span>Date they took the LIB test</span><input type="date" id="fx-d" max="${S.today}" value="${x.date ? addMonths(x.date, -LIB_MONTHS) : ''}"></label>`, 'Save',
      bg => { const v = $('#fx-d', bg).value; if (!v) throw 'Pick the date.'; return v; });
    if (d) run(() => call('adminSetLib', S.token, { name: x.name, testDate: d }), null, 'Saved. Expires ' + fullDate(addMonths(d, LIB_MONTHS)));
  });
  A().querySelectorAll('[data-librm]').forEach(b => b.onclick = async () => {
    if (!confirm('Remove ' + b.dataset.libname + ' from the LIB list?')) return;
    run(() => call('adminRemoveLib', S.token, b.dataset.librm, b.dataset.libname), b, 'Removed');

  if ($('#l-go')) $('#l-go').onclick = e => {

    else if (S.view === 'admin' && ['pending','att','team','alg','changes','dm','trn'].includes(S.adminTab)) {
      await calmRender('admin', async () => { S.quiet = true; try { await admLoad(); } finally { S.quiet = false; } });
    }
    else { Object.keys(S.cache).forEach(k => delete S.cache[k]); }       // other screens: next open reads fresh
    if (canView()) refreshPendingDot();
  } catch(e) { /* quiet: try again next time */ }
}
async function liveTick(){
  if (liveBusy || !S.token || !S.me || document.hidden) return;
  liveBusy = true;
  try {
    const r = await pingNow();
    if (r) {
      if (S.today && r.today && r.today !== S.today) { location.reload(); return; }   // a new day: start fresh
      if (liveVer && r.v !== liveVer) await liveRefresh();
      else if (liveWant) await liveRefresh();
      liveVer = r.v;
    }
  } finally { liveBusy = false; }
}
function liveStart(){
  if (liveTimer) return;
  liveTimer = setInterval(liveTick, LIVE_MS + Math.floor(Math.random() * 5000));
  document.addEventListener('visibilitychange', () => { if (!document.hidden) liveTick(); });
  window.addEventListener('focus', () => liveTick());
  document.addEventListener('focusout', () => { if (liveWant) setTimeout(() => { if (liveWant) liveTick(); }, 300); });
  document.addEventListener('click', () => { if (liveWant) setTimeout(() => { if (liveWant && !uiBusy()) liveRefresh(); }, 400); }, true);
}
liveStart();

boot();
})();
</script>
