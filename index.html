<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Range Deployment Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#17212B;        /* range board slate */
  --paper:#EEF1EC;      /* field grey */
  --card:#FFFFFF;
  --line:#D3DAD2;
  --muted:#5B6874;
  --steel:#2C5378;      /* you / selected */
  --steel-soft:#E3ECF4;
  --flag:#B3261E;       /* range red flag: alerts, rejected */
  --flag-soft:#F9E3E1;
  --go:#2E7A4C;         /* approved */
  --go-soft:#E1F0E6;
  --wait:#A26A0A;       /* pending */
  --wait-soft:#F6EBD5;
  --dep:#22C55E;        /* bright green: you are deployed */
  --dep-soft:#DCFCE7;
  --noapo:#FACC15;      /* yellow: range in use but no APO */
  --noapo-soft:#FEF9C3;
  --aps:#38BDF8;        /* sky blue: TF is APS */
  --aps-soft:#E0F2FE;
  --ext:#059669;        /* green: extended hours (EXT) */
  --ext-soft:#D1FAE5;
  --r-sm:6px; --r-md:10px;
  --cond:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.45 var(--body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--steel);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- shell ---------- */
.top{background:var(--ink);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;position:sticky;top:0;z-index:5}
.top-in{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{font:700 20px/1 var(--cond);letter-spacing:.02em}
.who{margin-left:auto;font-size:14px;opacity:.85;text-align:right}
.who button{background:none;border:0;color:#fff;text-decoration:underline;padding:0 0 0 8px;cursor:pointer;font-size:14px}
main{max-width:880px;margin:0 auto;padding:16px 16px 110px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav.tabs .in{max-width:880px;margin:0 auto;display:flex}
nav.tabs button{flex:1;min-width:0;background:none;border:0;padding:10px 2px 12px;font:600 15px/1.1 var(--cond);letter-spacing:.02em;color:var(--muted);cursor:pointer;border-top:3px solid transparent}
nav.tabs button[aria-current="page"]{color:var(--ink);border-top-color:var(--steel)}
nav.tabs button{line-height:1.05;min-height:52px;display:flex;align-items:center;justify-content:center;text-align:center;gap:2px}
@media (max-width:420px){nav.tabs button{font-size:13px;letter-spacing:0;padding-left:1px;padding-right:1px}}
nav.tabs .dot[hidden]{display:none}
nav.tabs .dot{display:inline-block;min-width:18px;padding:1px 5px;border-radius:9px;background:var(--flag);color:#fff;font:600 12px/16px var(--body);margin-left:4px}
@media (min-width:760px){
  nav.tabs{position:sticky;top:56px;bottom:auto;border-top:0;border-bottom:1px solid var(--line)}
  nav.tabs button{border-top:0;border-bottom:3px solid transparent;padding:12px 4px}
  nav.tabs button[aria-current="page"]{border-bottom-color:var(--steel)}
  main{padding-bottom:40px}
}

h1,h2,h3{font-family:var(--cond);font-weight:700;line-height:1.1;margin:0}
h2{font-size:26px;margin:4px 0 12px}
h3{font-size:19px;margin:22px 0 8px}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:14px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;margin-bottom:14px}

/* ---------- form bits ---------- */
label.f{display:block;margin:0 0 14px}
label.f>span{display:block;font-weight:600;font-size:14px;margin-bottom:5px}
input[type=text],input[type=password],input[type=date],input[type=time],select,textarea{
  width:100%;padding:11px 12px;border:1px solid #B9C3BA;border-radius:var(--r-sm);background:#fff;min-height:46px}
textarea{min-height:80px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:10px 18px;border-radius:var(--r-sm);border:1px solid var(--ink);background:var(--ink);color:#fff;font-weight:600;cursor:pointer}
.btn.ghost{background:#fff;color:var(--ink)}
.btn.go{background:var(--go);border-color:var(--go)}
.btn.no{background:#fff;color:var(--flag);border-color:var(--flag)}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:wait}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid #B9C3BA;background:#fff;border-radius:999px;padding:8px 14px;cursor:pointer;font-size:15px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.note{border-left:4px solid var(--wait);background:var(--wait-soft);padding:10px 12px;border-radius:0 var(--r-sm) var(--r-sm) 0;margin:0 0 12px;font-size:15px}
.note.red{border-color:var(--flag);background:var(--flag-soft)}
.note.blue{border-color:var(--steel);background:var(--steel-soft)}
.pill{display:inline-block;white-space:nowrap;font:600 13px/1 var(--body);padding:5px 9px;border-radius:999px}
.pill.Pending{background:var(--wait-soft);color:var(--wait)}
.pill.Approved{background:var(--go-soft);color:var(--go)}
.pill.Rejected{background:var(--flag-soft);color:var(--flag)}
.pill.Cancelled{background:#E6E9E6;color:var(--muted)}

/* ---------- login ---------- */
.login{max-width:420px;margin:8vh auto 0}
.login h1{font-size:40px;margin-bottom:6px}
.login .sec{padding:20px}

/* ---------- balances strip ---------- */
.strip{display:grid;grid-template-columns:repeat(2,1fr);background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:14px}
.strip div{padding:12px 14px;border-left:1px solid var(--line)}
.strip div:first-child{border-left:0}
.strip b{display:block;font:700 30px/1 var(--cond);font-variant-numeric:tabular-nums}
.strip span{font-size:13px;color:var(--muted)}

/* ---------- my days ---------- */
.days{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.day{display:grid;grid-template-columns:64px 1fr;border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.day .d{padding:12px 0 12px 14px;font-family:var(--cond)}
.day .d b{display:block;font-size:26px;line-height:1}
.day .d span{font-size:14px;color:var(--muted);font-weight:600}
.day.dep{background:var(--dep-soft)}
.day.dep .d{background:var(--dep)}
.day.dep .d span{color:var(--ink)}
.day .tdy{display:block;font:600 12px/1.2 var(--body);color:var(--steel);margin-top:3px;font-style:normal}
.day.dep .tdy{color:var(--ink)}
.day.dep .k.range,.day.dep .k.duty,.day.dep .k.medic{background:var(--ink);color:var(--dep)}
.dsel button.medep{box-shadow:inset 0 -5px var(--dep)}
.legend{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);margin:0 0 10px}
.legend i{width:16px;height:16px;border-radius:4px;background:var(--dep);display:inline-block}
.monbar{display:flex;align-items:center;gap:8px;margin:0 0 10px}
.monbar b{flex:1;text-align:center;font:700 21px/1 var(--cond)}
.monbar .btn{min-height:40px;padding:6px 14px}
.toggle{display:flex;gap:8px;align-items:center;font-size:15px;margin:0 0 10px}
.toggle input{width:20px;height:20px}
.day .e{padding:10px 14px 10px 4px}
.it{margin:2px 0 6px}
.it strong{font-family:var(--cond);font-size:18px;margin-right:6px}
.it .k{font-size:12px;font-weight:600;padding:2px 6px;border-radius:4px;margin-right:6px;vertical-align:2px}
.k.range{background:var(--ink);color:#fff}
.k.duty{background:var(--steel-soft);color:var(--steel)}
.k.medic{background:var(--go-soft);color:var(--go)}
.k.away{background:var(--wait-soft);color:var(--wait)}
.k.ext,.day.dep .k.ext{background:var(--ext);color:#fff}
.k.pending{background:var(--wait-soft);color:var(--wait)}
.it .x{display:block;font-size:14px;color:var(--muted)}
.free{color:var(--muted);font-size:15px;padding-top:4px}

/* ---------- board ---------- */
.wkbar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.wkbar h2{margin:0;flex:1;text-align:center;font-size:22px}
.wkbar .btn{min-height:40px;padding:6px 14px}
.dsel{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:14px}
.dsel button{background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 0 7px;cursor:pointer;font-family:var(--cond)}
.dsel button b{display:block;font-size:22px;line-height:1}
.dsel button span{font-size:13px;color:var(--muted);font-weight:600}
.dsel button i{display:block;font-style:normal;font-size:12px;color:var(--muted);font-family:var(--body)}
.dsel button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.dsel button[aria-pressed="true"] span,.dsel button[aria-pressed="true"] i{color:#C9D3DC}
.daytitle{font:600 15px/1.3 var(--body);color:var(--muted);margin:-4px 0 12px}

.boardlist{display:grid;gap:8px}
@media (min-width:640px){.boardlist{grid-template-columns:1fr 1fr}}
.rg{display:grid;grid-template-columns:78px 1fr;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;min-height:74px}
.rg .code{background:var(--ink);color:#fff;font:700 22px/1 var(--cond);display:flex;align-items:center;justify-content:center;letter-spacing:.01em}
.rg.idle{background:transparent;border-style:dashed}
.rg.idle .code{background:transparent;color:#9AA5AE;border-right:1px dashed var(--line)}
.rg.mine{border-color:var(--dep);box-shadow:0 0 0 3px var(--dep) inset;background:var(--dep-soft)}
.rg.mine .code{background:var(--dep);color:var(--ink)}
.rg.ext{border-color:var(--ext);box-shadow:0 0 0 3px var(--ext) inset;background:var(--ext-soft)}
.rg.ext .code{background:var(--ext);color:#fff}
.rg.mine.ext{border-color:var(--dep);box-shadow:0 0 0 3px var(--dep) inset;background:var(--dep-soft)}
.rg.ext .code::after{content:'EXT';display:block;font-size:12px;margin-top:4px;letter-spacing:.08em}
.rg .code{flex-direction:column}
.rg.aps{border-color:var(--aps);box-shadow:0 0 0 3px var(--aps) inset;background:var(--aps-soft)}
.rg.aps .code{background:var(--aps);color:var(--ink)}
.rg.aps .code::after{content:'APS';display:block;font-size:12px;margin-top:4px;letter-spacing:.08em}
.rg.mine.aps{border-color:var(--dep);box-shadow:0 0 0 3px var(--dep) inset;background:var(--dep-soft)}
.rg.noapo{border-color:var(--noapo);box-shadow:0 0 0 3px var(--noapo) inset;background:var(--noapo-soft)}
.rg.noapo .code{background:var(--noapo);color:var(--ink)}
.rg.noapo .code::after{content:'NO APO';display:block;font-size:11px;margin-top:4px;letter-spacing:.06em}
.rg.noapo .ppl .none{color:#854D0E;font-weight:700}
.note.yellow{border-color:var(--noapo);background:var(--noapo-soft)}
.dsel button.hasgap::after{content:"";position:absolute;top:5px;right:5px;width:9px;height:9px;border-radius:50%;background:var(--noapo);box-shadow:0 0 0 2px var(--card)}
.rg .body{padding:9px 12px}
.rg .ppl{font-weight:600}
.rg .ppl em{font-style:normal;color:var(--muted);font-weight:500}
.rg .meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:14px;color:var(--muted);margin-top:3px}
.rg .meta span b{color:var(--ink);font-weight:600}
.rg.idle .body{color:#9AA5AE;display:flex;align-items:center}

table.t{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;font-size:15px}
.t th,.t td{text-align:left;padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
.t th{font:600 14px var(--body);color:var(--muted);background:#F6F8F5;border-top:0}
.t tr.mine td{background:var(--dep-soft)}
.t tr.mine td:first-child,.t tr.mine th:first-child{box-shadow:inset 5px 0 var(--dep)}
.t td.num{font-variant-numeric:tabular-nums;text-align:right}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ---------- requests ---------- */
.req{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;margin-bottom:10px}
.req .h{display:flex;align-items:flex-start;gap:10px}
.req .h b{font:700 19px/1.15 var(--cond);flex:1}
.req .when{font-weight:600;margin:4px 0 2px}
.req .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.req .acts input{flex:1 1 100%}
.req ul{margin:6px 0 0;padding-left:18px;font-size:14px}

.oilpick label{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.oilpick label:first-child{border-top:0}
.oilpick input{width:20px;height:20px;flex:none}

.sub{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:#fff;padding:11px 16px;border-radius:var(--r-sm);max-width:92vw;z-index:20;transition:.2s;pointer-events:none;font-size:15px}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--flag)}
.loading{padding:40px 0;text-align:center;color:var(--muted)}
.edit-on .rg{cursor:pointer}
.edit-on .rg:hover{border-color:var(--steel)}
.edit-on .rg .body::after{content:"Tap to change";display:block;font-size:12px;color:var(--steel);margin-top:4px;font-weight:600}
.edit-on .rg.idle .body{flex-direction:column;align-items:flex-start;justify-content:center}
.t tr.undep td{background:#F4F7F3;line-height:1.6}
.edit-on .t tr[data-slot]{cursor:pointer}
.edit-on .t tr[data-slot] td:last-child::after{content:"  Edit";color:var(--steel);font-weight:600;font-size:13px}
.editbar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:-2px 0 12px;flex-wrap:wrap}
.editbar .btn{min-height:40px;padding:6px 14px}
.freebox{background:var(--go-soft);border-radius:var(--r-md);padding:10px 12px;margin-bottom:12px;font-size:15px}
.freebox b{font-family:var(--cond);font-size:17px;margin-right:6px}
.sheet-bg{position:fixed;inset:0;background:rgba(23,33,43,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:520px;max-height:88vh;overflow:auto;border-radius:14px 14px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
@media (min-width:640px){.sheet-bg{align-items:center}.sheet{border-radius:14px}}
.sheet h3{margin:0 0 4px;font-size:24px}
.sheet .src{font-size:14px;color:var(--muted);margin-bottom:14px}
.sheet .chips .chip{padding:6px 11px;font-size:14px}
.sheet .acts{display:flex;gap:8px;margin-top:16px}
.sheet .acts .btn{flex:1}
/* My OIL: one colour per state */
.oilsum{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.oilsum div{border-radius:var(--r-md);padding:10px 8px;text-align:center}
.oilsum b{display:block;font:700 28px/1 var(--cond);font-variant-numeric:tabular-nums}
.oilsum span{font-size:13px;font-weight:600}
.st-unused{background:var(--dep-soft);color:#14532D}
.st-half{background:var(--wait-soft);color:#7A4E05}
.st-hold{background:var(--steel-soft);color:var(--steel)}
.st-used{background:#E6E9E6;color:var(--muted)}
.oilrow{display:grid;grid-template-columns:8px 1fr auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;margin-bottom:8px}
.oilrow .bar{background:#B8C0B9}
.oilrow.st-unused .bar{background:var(--dep)}
.oilrow.st-half .bar{background:#E0A021}
.oilrow.st-hold .bar{background:var(--steel)}
.oilrow{color:var(--ink)}
.oilrow.st-unused,.oilrow.st-half,.oilrow.st-hold,.oilrow.st-used{background:var(--card)}
.oilrow .mid{padding:10px 12px}
.oilrow .mid b{font:700 18px/1.2 var(--cond)}
.oilrow .mid .x{font-size:14px;color:var(--muted)}
.oilrow .tag{align-self:center;margin-right:12px;font:600 13px/1 var(--body);padding:6px 10px;border-radius:999px;white-space:nowrap}
.oilrow.st-used .mid b{color:var(--muted)}
.chip.pk{display:inline-flex;flex-direction:column;align-items:flex-start;line-height:1.15;border-radius:12px;padding:7px 12px}
.chip.pk .sub{font-size:12px;color:var(--muted);font-weight:600}
.chip.pk .sub:empty{display:none}
.chip.pk[aria-pressed="true"] .sub{color:var(--dep)}
.rg.clash{border-color:var(--flag);box-shadow:0 0 0 3px var(--flag) inset;background:var(--flag-soft)}
.rg.clash .code{background:var(--flag);color:#fff}
.rg .why,.t .why{color:var(--flag);font-weight:600;font-size:14px;margin-top:2px}
.t tr.clash td{background:var(--flag-soft)}
.t tr.clash td:first-child{box-shadow:inset 5px 0 var(--flag)}
.dsel button{position:relative}
.insp{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px;margin:0 0 14px}
.insp h3{margin:0 0 8px;font-size:17px}
.irow{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-sm);border:1px solid var(--line);border-left:5px solid #22C55E;margin-top:6px;background:#fff}
.irow .it2{flex:1;min-width:0}.irow .it2 b{display:block}.irow .it2 span{font-size:13px;color:var(--muted)}
.irow.soon{background:#FEF9C3;border-color:#FACC15;border-left-color:#EAB308}
.irow.due,.irow.overdue{background:var(--flag-soft);border-color:#F2A9A2;border-left-color:var(--flag)}
.irow.due .it2 span,.irow.overdue .it2 span{color:var(--flag);font-weight:600}
.irow.unset{border-left-color:#9AA5AE}
.irow .ib{min-height:36px;padding:4px 12px;font-size:14px}
.iedit{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin:8px 0 2px;padding:8px 10px;background:#F4F6F3;border-radius:var(--r-sm)}
.iedit input{min-height:38px;padding:6px 8px}
.iedit[hidden]{display:none}
/* training */
.tg{border-collapse:separate;border-spacing:2px;width:100%;table-layout:fixed;font-size:12px}
.tg th{font-size:11px;color:var(--muted);font-weight:600;text-align:center;line-height:1.15;padding:2px 0}
.tg th.nm{text-align:left;width:74px;color:var(--ink);font-size:12px}
.tg th.nm small{display:block;font-weight:400;color:var(--muted);font-size:10.5px}
.tg td{text-align:center;border-radius:5px;padding:7px 0;font-weight:600;font-size:11px;cursor:pointer;white-space:nowrap;overflow:hidden}
.ts-done{background:#DCFCE7;color:#166534}.ts-arr,.ts-wait{background:#DBEAFE;color:#1E40AF}.ts-todo{background:#FEF9C3;color:#854D0E}
.ts-late,.ts-missed,.ts-fail{background:#FDE2E1;color:#B3261E}.ts-na,.ts-locked,.ts-soon2{background:#ECEFF1;color:#8A959E}
.ttiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}.ttiles div{border-radius:9px;padding:7px 4px;text-align:center;font-size:12px}.ttiles b{display:block;font-size:22px;line-height:1.1}
.tlist{border-radius:9px;padding:8px 10px;margin-bottom:6px;font-size:14px;border:1px solid var(--line)}
.tlist b{display:block}.tlist small{color:var(--muted)}

<body>
<div id="app"><div class="loading">Loading&#x2026;</div></div>
<script>
/* If anything goes wrong while starting, show it on the page instead of a blank screen */
window.onerror = function (msg, src, line) {
  var el = document.getElementById('app');
  if (el) el.innerHTML = '<main class="login"><h1>Something went wrong</h1><div class="note red">' +
    String(msg).replace(/[<>&]/g, '') + (line ? ' (line ' + line + ')' : '') +
    '</div><p>Send a screenshot of this to whoever set up the app.</p></main>';
};
</script>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function () {   // private scope: nothing here can clash with Google's own page code
"use strict";
/* ============================================================
   API bridge. Runs against Apps Script when deployed; falls back
   to sample data from the Sep 21-27, 2026 tab when opened locally.
   ============================================================ */
// Two ways to run: served by Apps Script (google.script.run), or hosted elsewhere (e.g. GitHub Pages)
// talking to the Apps Script API link set in window.API_URL. The second never sends Google sign-ins.
const API_URL = /^https:/.test(String(window.API_URL || '')) && /\/exec$/.test(window.API_URL) ? window.API_URL : '';
const GAS = !!(window.google && google.script && google.script.run);
const LIVE = GAS || !!API_URL;
const READ_FNS = ['getInspections','getTraining','getBirthdays','adminAttendance','adminChanges','adminLib','adminOil','adminPending','adminRefresh','adminStaff','adminTeam',
  'getHome','getLoginInfo','getMyOil','getMyOilHistory','getMyRequests','getMySchedule','getWeek','resume'];
function apiOnce(fn, args){
  return fetch(API_URL, {
    method: 'POST', credentials: 'omit', redirect: 'follow',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },   /* keeps it a simple request */
    body: JSON.stringify({ fn, args })
  }).then(r => r.text()).then(t => {
    try { return JSON.parse(t); } catch(e) { const x = new Error('BADREPLY'); x.net = true; throw x; }
  }, () => { const x = new Error('NONET'); x.net = true; throw x; });
}
async function apiCall(fn, args){
  const read = READ_FNS.indexOf(fn) >= 0;
  const tries = read ? 3 : 1;
  let o = null, last = null;
  for (let i = 0; i < tries; i++) {
    try { o = await apiOnce(fn, args); break; }
    catch(e) { last = e; if (i < tries - 1) await new Promise(r => setTimeout(r, 800 * (i + 1))); }
  }
  if (!o) {
    if (!read) throw new Error('No reply from the server, so this may or may not have been saved. Refresh and check before trying again.');
    throw new Error(last && last.message === 'BADREPLY'
      ? 'Google is busy or the app is being updated. Wait a minute and try again.'
      : 'Could not reach the server. Check your connection and try again.');
  }
  if (!o.ok) throw new Error(o.error);
  return o.result;
}
function call(fn, ...args){
  if (!GAS && API_URL) return apiCall(fn, args);
  return new Promise((res, rej) => {
    if (!LIVE) {
      setTimeout(() => { try { res(MOCK[fn](...args)); } catch(e){ rej(e); } }, 200);
      return;
    }
    google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args);
  });
}

const S = { token:null, me:null, types:[], today:null, view:'home', monday:null, dayIdx:0, adminTab:'pending', cache:{} };
const $ = (s, el=document) => el.querySelector(s);
const canManage = () => S.me && (S.me.role === 'Admin' || S.me.role === 'Manager');   // same rights
const hasOil = () => S.me && S.me.role !== 'Admin';                                       // admin: no off days
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DOW = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function pd(s){ const p = String(s).slice(0,10).split('-').map(Number); return new Date(p[0], p[1]-1, p[2], 12); }
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addD(s, n){ const d = pd(s); d.setDate(d.getDate()+n); return ymd(d); }
function mondayOf(s){ const d = pd(s); d.setDate(d.getDate() - ((d.getDay()+6)%7)); return ymd(d); }
function dowIdx(s){ return (pd(s).getDay()+6)%7; }
function nice(s){ const d = pd(s); return DOW[dowIdx(s)]+' '+d.getDate()+' '+MON[d.getMonth()]; }
function span(a, b){ return a === b || !b ? nice(a) : nice(a)+' to '+nice(b); }
function nDays(a, b){ return Math.round((pd(b) - pd(a)) / 864e5) + 1; }

function setStaff(list){
  S.staff = list;
  S.pats = [];
  list.forEach(p => [p.name].concat(p.aliases || []).forEach(a => {
    const c = String(a).toUpperCase().replace(/[^A-Z0-9]+/g, ' ').trim();
    if (c) S.pats.push({ re: new RegExp('(^| )' + c + '(?= |$)', 'g'), len: c.length, name: p.name });
  }));
  S.pats.sort((a, b) => b.len - a.len);
}
function namesIn(text){
  let t = String(text || '').toUpperCase().replace(/[^A-Z0-9]+/g, ' ').trim();
  const found = [];
  if (!t) return found;
  S.pats.forEach(p => { p.re.lastIndex = 0; if (p.re.test(t)) { if (!found.includes(p.name)) found.push(p.name); p.re.lastIndex = 0; t = t.replace(p.re, '$1_'); } });
  return found;
}

let toastT;
function toast(msg, err){
  const t = $('#toast'); t.textContent = msg; t.className = 'on' + (err ? ' err' : '');
  clearTimeout(toastT); toastT = setTimeout(() => t.className = '', 3200);
}
function fail(e){
  const m = (e && e.message) || String(e);
  if (m.indexOf('SESSION_EXPIRED') >= 0) { S.token = null; saveToken(''); toast('Your session ended. Sign in again.', true); return renderLogin(); }
  toast(m.replace(/^Error:\s*/, ''), true);
}
function busy(btn, on){ if (btn) { btn.disabled = on; } }

/* ============================================================
   Sign in
   ============================================================ */
async function boot(){
  if (!LIVE && !(SNAP.staff && SNAP.staff.length) && 'API_URL' in window) {
    $('#app').innerHTML = `<main class="login"><h1>Range Deployment Portal</h1>
      <div class="note blue">The app link has not been added yet. Open <b>index.html</b>, paste your web app link (ending in /exec) into the <b>API_URL</b> line near the top, and save.</div></main>`;
    return;
  }
  if (!LIVE && !(SNAP.staff && SNAP.staff.length)) {
    $('#app').innerHTML = `<main class="login"><h1>Range Deployment Portal</h1>
      <div class="note blue">This is the live app file. It only works once it's pasted into Google Apps Script and deployed, and then it shows your real staff and deployment from the Google Sheet.</div>
      <p>To look around on this computer, open <b>Preview.html</b> instead. It has a snapshot of your workbook.</p></main>`;
    return;
  }
  $('#app').innerHTML = '<div class="loading">Loading\u2026</div>';
  let saved = '';
  try { saved = API_URL ? (localStorage.getItem('rdp_token') || '') : ''; } catch(e) {}
  if (saved) {
    try { return signedIn(await call('resume', saved)); } catch(e) { saveToken(''); }
  }
  if (API_URL) { S.loginInfo = { auto:null }; return renderLogin(); }   // hosted page: nothing to ask the server first
  try {
    const info = await call('getLoginInfo');
    S.loginInfo = info;
    if (info.auto) return signedIn(info.auto);
    renderLogin();
  } catch(e){
    const m = String((e && e.message) || e).replace(/[<>&]/g, '');
    $('#app').innerHTML = `<main class="login"><h1>Range Deployment Portal</h1>
      <div class="note red"><b>The app couldn't load.</b><br>${m}</div>
      <p class="small muted">If you are signed in to more than one Google account in this browser, open the link in an Incognito / Private window and try again.</p>
      <button class="btn" onclick="boot()">Try again</button></main>`;
  }
}

function renderLogin(){
  let last = '';
  try { last = localStorage.getItem('rdp_name') || ''; } catch(e) {}
  $('#app').innerHTML = (LIVE ? '' : '<div class="demo">Preview using a snapshot of your workbook (Aug 2026 to Mar 2027). Nothing here is saved.</div>') + `
  <main class="login">
    <h1>Range Deployment Portal</h1>
    <p class="muted">Ammo officers and medics: see your postings, check your off days, and apply for leave.</p>
    <div class="sec">
      <label class="f"><span>Your name</span>
        <input id="lg-name" type="text" autocomplete="username" autocapitalize="characters" spellcheck="false" placeholder="As on the roster, e.g. LEONARD" value="${esc(last)}"></label>
      <label class="f"><span>PIN</span>
        <input id="lg-pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="6" placeholder="4 to 6 digits"></label>
      <p class="small muted">New here? Ask your admin for your first PIN. After 5 wrong PINs the account is locked until an admin unlocks it.</p>
      <button class="btn block" id="lg-go">Sign in</button>
    </div>
  </main>`;
  const go = async () => {
    const b = $('#lg-go'); busy(b, true);
    const name = $('#lg-name').value.trim();
    try {
      const r = await call('login', name, $('#lg-pin').value);
      try { localStorage.setItem('rdp_name', name.toUpperCase()); } catch(e) {}
      if (r.mustChange) return firstPin(r);
      signedIn(r);
    } catch(e){ fail(e); busy(b, false); }
  };
  $('#lg-go').onclick = go;
  $('#lg-pin').onkeydown = e => { if (e.key === 'Enter') go(); };
  (last ? $('#lg-pin') : $('#lg-name')).focus();
}

/* First sign-in with a PIN from the admin: choose your own */
function firstPin(r){
  $('#app').innerHTML = `<main class="login">
    <h1>Choose your own PIN</h1>
    <p class="muted">Hi ${esc(r.me.name)}. You signed in with a PIN from your admin. Pick your own 4 to 6 digit PIN; only you will know it.</p>
    <div class="sec">
      <label class="f"><span>PIN from your admin</span><input id="fp-c" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password"></label>
      <label class="f"><span>New PIN</span><input id="fp-n" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"></label>
      <label class="f"><span>New PIN again</span><input id="fp-n2" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"></label>
      <button class="btn block" id="fp-go">Save my PIN</button>
    </div></main>`;
  S.token = r.token;
  $('#fp-go').onclick = async e => {
    if ($('#fp-n').value !== $('#fp-n2').value) return toast('The two new PINs are different.', true);
    busy(e.target, true);
    try { await call('changeMyPin', r.token, $('#fp-c').value, $('#fp-n').value); toast('PIN saved'); signedIn(r); }
    catch(x){ fail(x); busy(e.target, false); }
  };
  $('#fp-c').focus();
}

/* Change PIN any time, from the header */
function changePin(){
  const bg = document.createElement('div');
  bg.className = 'sheet-bg';
  bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><h3>Change PIN</h3>
    <label class="f"><span>Current PIN</span><input id="cp-c" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password"></label>
    <label class="f"><span>New PIN</span><input id="cp-n" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"></label>
    <label class="f"><span>New PIN again</span><input id="cp-n2" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"></label>
    <div class="acts"><button class="btn ghost" id="cp-x">Cancel</button><button class="btn" id="cp-go">Save</button></div></div>`;
  document.body.appendChild(bg);
  $('#cp-x', bg).onclick = () => bg.remove();
  $('#cp-go', bg).onclick = async e => {
    if ($('#cp-n', bg).value !== $('#cp-n2', bg).value) return toast('The two new PINs are different.', true);
    busy(e.target, true);
    try { await call('changeMyPin', S.token, $('#cp-c', bg).value, $('#cp-n', bg).value); bg.remove(); toast('PIN changed'); }
    catch(x){ fail(x); busy(e.target, false); }
  };
  $('#cp-c', bg).focus();
}

const saveToken = t => { try { t ? localStorage.setItem('rdp_token', t) : localStorage.removeItem('rdp_token'); } catch(e) {} };
function signedIn(r){
  saveToken(r.token);
  Object.assign(S, { token:r.token, me:r.me, types:r.types, today:r.today, edit:false });
  setStaff(r.staff || []);
  S.monday = mondayOf(r.today); S.dayIdx = dowIdx(r.today);
  renderShell(); go(S.me.role === 'Admin' ? 'board' : 'home');
}

/* ============================================================
   Shell + navigation
   ============================================================ */
function renderShell(){
  // The Admin account only plans and manages: no personal tabs
  const tabs = S.me.role === 'Admin' ? [['board','Deployment Plan']]
    : [['home','My Deploy'],['board','Deployment Plan'],['oil','My OIL'],['apply','Apply'],['requests','Requests']];
  if (canManage()) tabs.push(['admin','Admin']);
  $('#app').innerHTML = (LIVE ? '' : '<div class="demo">Preview: snapshot of your workbook, changes not saved</div>') + `
  <header class="top"><div class="top-in">
    <div class="brand">Range Deployment</div>
    <div class="who">${esc(S.me.name)}<button id="pinbtn">PIN</button><button id="out">Sign out</button></div>
  </div></header>
  <nav class="tabs" aria-label="Sections"><div class="in">
    ${tabs.map(([k,l]) => `<button data-v="${k}">${l}${k==='admin' ? '<span class="dot" id="pcount" hidden></span>' : ''}</button>`).join('')}
  </div></nav>
  <main id="view"></main>`;
  document.querySelectorAll('nav.tabs button').forEach(b => b.onclick = () => go(b.dataset.v));
  $('#out').onclick = () => { S.token = null; saveToken(''); renderLogin(); };
  $('#pinbtn').onclick = changePin;
}

function go(v){
  S.view = v;
  document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-current', b.dataset.v === v ? 'page' : 'false'));
  window.scrollTo(0, 0);
  return ({ home:viewHome, board:viewBoard, oil:viewMyOil, apply:viewApply, requests:viewRequests, admin:viewAdmin })[v]();
}
const V = () => $('#view');
const loading = () => V().innerHTML = '<div class="loading">Loading\u2026</div>';

/* ============================================================
   My days
   ============================================================ */
async function viewHome(){
  S.mcache = {};                                        // re-read the month view from the sheet too
  const key = 'rdp_home_' + S.me.name;
  let cached = null;
  try { cached = JSON.parse(localStorage.getItem(key) || 'null'); } catch(e) {}
  if (cached && cached.today === S.today) { drawHome(cached, true); } else loading();
  try {
    const h = await call('getHome', S.token);
    h.today = S.today;
    try { localStorage.setItem(key, JSON.stringify(h)); } catch(e) {}
    if (S.view !== 'home') return;                      // user moved on while it loaded
    drawHome(h, false);
  } catch(e){ fail(e); }
}
function drawHome(h, stale){
  {
    const b = h.balances;
    let lib = '';
    if (h.lib) {
      const left = nDays(S.today, h.lib) - 1;
      if (left < 0) lib = `<div class="note red">Your LIB expired on ${nice(h.lib)}. Book your LIB test with your admin.</div>`;
      else if (left <= 45) lib = `<div class="note">Your LIB expires on ${nice(h.lib)}, in ${left} day${left===1?'':'s'}.</div>`;
    }
    V().innerHTML = `
      <div class="hirow"><div><h2>Hi ${esc(h.me.name)}${stale ? ' <span class="small muted" style="font:500 14px var(--body)">updating...</span>' : ''}</h2>
        <div class="idno">${h.sid ? 'ID ' + esc(h.sid) : esc(h.me.role)}</div></div>${h.attendance ? clockCard(h.attendance) : ''}</div>
      ${h.attendance ? clockNotes(h.attendance) : ''}
      ${bdayBanner(h.birthdays)}
      ${h.inspections ? inspCard(h.inspections) : ''}
      ${h.training ? myTrnCard(h.training) : ''}
      <div class="strip" style="${hasOil() ? '' : 'grid-template-columns:1fr'}">
        ${hasOil() ? `<div><b>${fmtN(b.oilAvailable)}</b><span>Off days left${b.oilReserved ? ' (+'+fmtN(b.oilReserved)+' on hold)' : ''}</span></div>` : ''}
        <div><b>${b.pending}</b><span>Waiting for approval</span></div>
      </div>
      ${lib}
      <h3>My schedule</h3>
      <div class="sub" role="group" aria-label="Period">
        <button class="chip" data-m="14" aria-pressed="${S.hmode !== 'month'}">Next 14 days</button>
        <button class="chip" data-m="month" aria-pressed="${S.hmode === 'month'}">Full schedule by month</button></div>
      <div id="sched"></div>`;
    S.next14 = h.upcoming;
    wireClock();
    if (h.inspections) wireInsp(h.inspections);
    if (h.training) wireMyTrn();
    document.querySelectorAll('[data-m]').forEach(b => b.onclick = () => {
      S.hmode = b.dataset.m;
      document.querySelectorAll('[data-m]').forEach(x => x.setAttribute('aria-pressed', x === b));
      drawSched();
    });
    drawSched();
    if (canManage()) refreshPendingDot();
  }
}
/* ---------- APO training ---------- */
const TRN_TXT = { done:'', arr:'', wait:'', todo:'Arrange', late:'Arrange', missed:'Missed', fail:'', na:'N/A', locked:'TS first', soon2:'Jul' };
const TRN_RES = k => k === 'MA' ? ['DONE','ABSENT'] : ['PASSED','FAILED','ABSENT'];
const resWord = r => ({ PASSED:'Passed', FAILED:'Failed', ABSENT:'Absent', DONE:'Done' })[r] || r;
const sdt = s => pd(s).getDate() + ' ' + MON[pd(s).getMonth()];
/* State of one APO's training for the current period */
function trnCell(d, person, per){
  if (per.minAge && person.age != null && person.age < per.minAge) return { st:'na' };
  const rs = d.rows.filter(r => r.name === person.name && r.t === per.t && r.period === per.id);
  const done = rs.find(r => r.result === 'PASSED' || r.result === 'DONE');
  if (done) return { st:'done', date:done.resultDate || done.arranged, row:done, rs };
  if (per.needs) {
    const np = d.periods.find(p => p.k === per.needs);
    if (np && trnCell(d, person, np).st !== 'done') return { st:'locked', rs };
  }
  const open = rs.filter(r => !r.result).pop();
  if (open) return { st: open.arranged <= d.today ? 'wait' : 'arr', date:open.arranged, row:open, rs };
  const last = rs[rs.length - 1];
  if (last) return { st:'fail', date:last.arranged, result:last.result, row:last, rs };
  if (d.today < per.start) return { st:'soon2', rs };
  if (d.today > per.end) return { st:'missed', rs };
  if (d.today.slice(0, 7) === per.end.slice(0, 7)) return { st:'late', rs };
  return { st:'todo', rs };
}
function trnGrid(d){ return d.people.map(p => ({ p, cs: d.periods.map(per => Object.assign({ per }, trnCell(d, p, per))) })); }
const TRN_RED = ['late','missed','fail'];
function trnLabelLong(per){ return per.k === 'IPPT' ? 'IPPT' : per.label; }
function periodText(per){
  if (per.k === 'WHT1' || per.k === 'WHT2') return per.label + ' ' + per.id.slice(0, 4);
  if (per.k === 'IPPT') return 'IPPT year 1 Apr ' + per.start.slice(0, 4) + ' to 31 Mar ' + per.end.slice(0, 4);
  return 'Work year ' + per.id;
}

    else if (TRN_RED.includes(c.st)) cnt.red++;
    if (c.st === 'todo' || c.st === 'late' || c.st === 'missed') (toArr[trnLabelLong(c.per)] = toArr[trnLabelLong(c.per)] || []).push(p.name);

async function drawSched(){

  if (S.hmode !== 'month') {
    box.innerHTML = legend + `<div class="days">${S.next14.map(dayRow).join('')}</div>`;
    return;
  }
  if (!S.month) S.month = S.today.slice(0, 7);
  const key = S.month;
  const [y, m] = key.split('-').map(Number);
  const first = key + '-01';
  const last = ymd(new Date(y, m, 0, 12));
  S.mcache = S.mcache || {};
  const bar = `<div class="monbar"><button class="btn ghost" id="mp">Prev</button><b>${MONL[m-1]} ${y}</b><button class="btn ghost" id="mn">Next</button></div>

    ? d.items.map(i => `<div class="it"><span class="k ${i.kind}">${KLABEL[i.kind]}</span><strong>${esc(i.what)}</strong>${i.ext ? ` <span class="extag">EXT ${esc(hrs(i.ext))}</span>` : ''}${i.aps ? ' <span class="apstag">APS</span>' : ''}${i.detail ? `<span class="x">${esc(i.detail)}</span>` : ''}</div>`).join('')
    : `<div class="free">${d.noTab ? 'No weekly tab yet' : 'No posting'}</div>`;
  return `<div class="day${d.date === S.today ? ' today' : ''}${isDep(d) ? ' dep' : ''}"><div class="d"><b>${dt.getDate()}</b><span>${DOW[dowIdx(d.date)]}</span>${d.date === S.today ? '<i class="tdy">Today</i>' : ''}</div>
    <div class="e">${d.title && /\(/.test(d.title) ? `<div class="small muted">${esc(d.title.replace(/^\w+\s*/, ''))}</div>` : ''}${items}</div></div>`;
}

/* ============================================================
   Board (weekly roster)
   ============================================================ */
async function viewBoard(){
  loading();
  try {
    const key = S.monday;
    const isAdm = S.me && S.me.role === 'Admin';
    const [wk, insp, bd] = await Promise.all([
      call('getWeek', S.token, key),                   // always read fresh from the sheet
      isAdm ? call('getInspections', S.token).catch(() => S.insp || null) : Promise.resolve(null),
      isAdm ? call('getBirthdays', S.token).catch(() => S.bdays || []) : Promise.resolve(null)]);
    if (insp) S.insp = insp;
    if (bd) S.bdays = bd;
    S.cache[key] = wk;
    drawBoard(wk);
  } catch(e){ fail(e); }
}
function moveWeek(n){ S.monday = addD(S.monday, 7*n); viewBoard(); }
function drawBoard(wk){
  const end = addD(wk.monday, 6);
  const admin = canManage();
  const isAdmAcct = S.me && S.me.role === 'Admin';

      <button class="btn ghost" id="wn" aria-label="Next week">Next</button></div>
      <div style="text-align:right;margin:-4px 0 10px"><button class="btn ghost" id="wr" style="min-height:34px;padding:4px 12px;font-size:14px">Refresh from sheet</button></div>`;

      return `<button data-i="${i}" aria-pressed="${i===S.dayIdx}" class="${n >= 6 ? 'full ' : n === 5 ? 'busy ' : ''}${medep ? 'medep' : ''}${nc ? ' hasclash' : ng ? ' hasgap' : ''}" ${nc || ng ? `title="${[nc && nc + ' to cover', ng && ng + ' without APO'].filter(Boolean).join(', ')}"` : ''}>${hx || ha ? `<span class="mk">${hx ? '<u class="e" title="Extended hours"></u>' : ''}${ha ? '<u class="a" title="APS range"></u>' : ''}</span>` : ''}<span>${DOW[i]}</span><b>${pd(x.date).getDate()}</b><i>${n} rng</i></button>`;

    const ranges = d.ranges.map(r => {

        .map(m => `<span>${m[0] ? m[0]+' ' : ''}<b>${esc(m[1])}</b></span>`).join('');
      const bad = r.people.some(n => away[n]);

        <div class="ppl">${r.emp ? esc(r.emp) : '<span class="none">No APO assigned</span>'}${extOf(r.rmk) ? ` <span class="extag">EXT ${esc(hrs(extOf(r.rmk)))}</span>` : ''}${r.sup ? ` <em>with ${esc(r.sup)}</em>` : ''}</div>
        ${whyLine(r.people)}<div class="meta">${meta}</div></div></div>`;

        <div><b>Medics</b> - ${freeM.length ? esc(freeM.join(', ')) : '<span class="muted">none</span>'}</div>

      ${duties.map(x => { const ppl = x.mainPeople.concat(x.sparePeople), bad = ppl.some(n => away[n]);
        const dx = ppl.map(n => (d.report || {})[n]).filter(Boolean)[0];
        return `<tr data-slot="duty|${esc(x.duty)}" class="${bad ? 'clash' : ppl.indexOf(me)>=0 ? 'mine' : ''}"><td>${esc(x.duty)}${dx ? ` <span class="extag">EXT ${esc(hrs(dx))}</span>` : ''}</td><td>${esc(x.main)}${whyLine(x.mainPeople)}</td><td>${esc(x.spare)}${whyLine(x.sparePeople)}</td></tr>`; }).join('')}
      ${undepRow}</table></div>`;
    const medicT = medics.length ? `<h3>Medics</h3><div class="scroll"><table class="t"><tr><th>Role</th><th>Name</th><th>At</th></tr>
      ${medics.map(x => { const bad = x.people.some(n => away[n]);

    const rgs = reportGroups(d);

      ${rgs.map(g => `<tr class="${g.names.indexOf(me)>=0?'mine':''}"><th style="width:34%"><span class="extag">EXT</span> Report ${esc(hrs(g.t))}</th><td>${esc(g.names.join(', '))}</td></tr>`).join('')}
      ${d.absences.map(x => `<tr class="${x.people.indexOf(me)>=0?'mine':''}"><th style="width:34%">${esc(x.label)}</th><td>${esc(x.text)}</td></tr>`).join('')}</table></div>` : '';
    const editbar = admin ? `<div class="editbar">
        <span class="small muted">${ed ? 'Tap a range, duty or medic row to change who is posted. Undeployed staff are listed under Duties.' : ''}</span>
        <span style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost" id="wa">WhatsApp message</button>${ed ? '<button class="btn no" id="abs">Someone absent</button>' : ''}
        <button class="btn ${ed ? '' : 'ghost'}" id="edt">${ed ? 'Done editing' : 'Edit deployment'}</button></span></div>` : '';
    const loadKey = `<span><u style="background:#FFFBEB;border-radius:3px;box-shadow:0 0 0 1px #F0D98A"></u>5 ranges</span><span><u style="background:#FEF2F1;border-radius:3px;box-shadow:0 0 0 1px #EDB3AC"></u>6+ ranges</span>`;
    const keyItems = [['e','var(--ext)','EXT'],['a','var(--aps)','APS'],['g','var(--noapo)','No APO'],['c','var(--flag)','To cover']];
    const dayKey = `<div class="daykey">${keyItems.map(k => `<span><u style="background:${k[1]}"></u>${k[2]}</span>`).join('')}${loadKey}</div>`;
    V().innerHTML = head + `<div class="dsel">${sel}</div>${dayKey}
      <p class="daytitle">${nice(d.date)}${d.title && /\(/.test(d.title) ? ' ' + esc(d.title.replace(/^\w+\s*/, '')) : ''}</p>
      ${dayClash.length ? `<div class="note red"><b>${dayClash.length} posting${dayClash.length === 1 ? '' : 's'} to cover</b> (deployed but away):
        <ul style="margin:4px 0 0;padding-left:18px">${dayClash.map(c => `<li><b>${esc(c.where)}</b>: ${esc(c.name)} (${esc(c.why)})</li>`).join('')}</ul>
        ${admin ? '<div class="small" style="margin-top:6px">Tap <b>Edit deployment</b>, then the red range or row, to put someone else in.</div>' : ''}</div>` : ''}
      ${dayGap.length ? `<div class="note yellow"><b>${dayGap.length} range${dayGap.length === 1 ? '' : 's'} without an APO:</b> ${esc(dayGap.map(r => r.range).join(', '))}
        ${admin ? '<div class="small" style="margin-top:4px">Tap <b>Edit deployment</b>, then the yellow range, to assign one.</div>' : ''}</div>` : ''}
      ${editbar}
      <div class="${ed ? 'edit-on' : ''}"><div class="boardlist">${ranges}</div>${dutyT}${medicT}</div>${awayT}`;
    document.querySelectorAll('.dsel button').forEach(b => b.onclick = () => { S.dayIdx = +b.dataset.i; drawBoard(wk); });
    if ($('#edt')) $('#edt').onclick = () => { S.edit = !S.edit; drawBoard(wk); };
    if ($('#abs')) $('#abs').onclick = () => openAbsent({ day:d, onDone: w => drawBoard(w) });
    if ($('#wa')) $('#wa').onclick = () => openWhatsApp(d);
    if (ed) document.querySelectorAll('.edit-on [data-slot]').forEach(el => el.onclick = () => {

      openSlotEditor(wk, d, kind, label);

  }
  if (isAdmAcct && S.insp) wireInsp(S.insp);
  $('#wr').onclick = () => viewBoard();
  $('#wp').onclick = () => moveWeek(-1);
  $('#wn').onclick = () => moveWeek(1);
}

/* Staff not posted and not listed as away on a given day */
function busyOn(day){
  const b = new Set();
  day.ranges.forEach(r => r.people.forEach(n => b.add(n)));
  day.duties.forEach(x => x.mainPeople.concat(x.sparePeople).forEach(n => b.add(n)));
  day.medics.forEach(m => m.people.forEach(n => b.add(n)));
  day.absences.forEach(a => a.people.forEach(n => b.add(n)));
  return b;
}
/* Grouped name list for replacement drop-downs. Managers are always offered as the reserve. */
function pickerOptions(day, pool, exclude){
  exclude = exclude || [];
  const busy = busyOn(day);
  const by = role => (S.staff || []).filter(p => p.role === role && !exclude.includes(p.name)).map(p => p.name).sort();
  const grp = (label, names, mark) => names.length ? `<optgroup label="${label}">${names.map(n =>
    `<option value="${esc(n)}">${esc(n)}${mark && busy.has(n) ? ' (posted or away)' : ''}</option>`).join('')}</optgroup>` : '';
  const mg = by('Manager');
  if (pool === 'Medic') {
    const m = by('Medic'), bk = by('Backup Medic');
    return grp('Undeployed medics', m.filter(n => !busy.has(n))) + grp('Backup medics', bk, true) + grp('Medics posted or away', m.filter(n => busy.has(n)));
  }
  const a = by('APO');
  return grp('Undeployed APO', a.filter(n => !busy.has(n))) + grp('Managers (reserve)', mg, true) + grp('APO posted or away', a.filter(n => busy.has(n)));
}
/* Names allowed in a slot: APO slots take APOs (and managers as reserve); medic slots take medics only */
function namesFor(pool){
  const ok = pool === 'Medic' ? ['Medic', 'Backup Medic'] : ['APO', 'Manager'];
  return (S.staff || []).filter(p => ok.includes(p.role)).map(p => p.name).sort();
}
/* Who is away on a day, from the leave rows (AL, MC, OIL, UL, Course\u2026). "Off Day Earned" is not an absence. */
const NOT_AWAY = ['OFFDAYEARNED'];
function awayOn(day){
  const m = {};
  day.absences.forEach(a => {
    if (NOT_AWAY.includes(a.label.toUpperCase().replace(/\s+/g, ''))) return;
    a.people.forEach(n => {
      const part = a.text.split(/\s*,\s*/).filter(x => namesIn(x).includes(n)).join(', ') || a.text;
      (m[n] = m[n] || []).push(part);
    });
  });
  return m;
}
/* Postings on that day whose person is also away */
/* Ranges in use (officer or TF filled in) with nobody in the APO row */
const isApsTf = tf => /(^|[^A-Z])APS([^A-Z]|$)/i.test(tf || '');
function noApoOn(day){ return day.ranges.filter(r => r.active && !String(r.emp || '').trim()); }
function clashesOn(day){
  const away = awayOn(day), out = [];
  const chk = (names, where) => names.forEach(n => { if (away[n]) out.push({ name:n, where, why:away[n].join(', ') }); });
  day.ranges.forEach(r => chk(r.people, r.range));
  day.duties.forEach(x => { chk(x.mainPeople, x.duty + ' main'); chk(x.sparePeople, x.duty + ' spare'); });
  day.medics.forEach(m => chk(m.people, m.role));
  return out;
}
function freeOn(day, role){
  const b = busyOn(day);
  return (S.staff || []).filter(p => p.role === role && !b.has(p.name)).map(p => p.name);
}
function clashes(day, text, kind, label, field){
  const out = [];
  namesIn(text).forEach(n => {
    day.ranges.forEach(r => { if (r.people.includes(n) && !(kind === 'range' && label === r.range)) out.push(`${n} is also on ${r.range}`); });
    day.duties.forEach(x => {
      if (x.mainPeople.includes(n) && !(kind === 'duty' && label === x.duty && field === 'main')) out.push(`${n} is also ${x.duty} main`);
      if (x.sparePeople.includes(n) && !(kind === 'duty' && label === x.duty && field === 'spare')) out.push(`${n} is also ${x.duty} spare`);
    });
    day.medics.forEach(m => { if (m.people.includes(n) && !(kind === 'medic' && label === m.role)) out.push(`${n} is also ${m.role}`); });
    day.absences.forEach(a => { if (a.people.includes(n)) out.push(`${n} is under ${a.label}: ${a.text}`); });
  });
  return [...new Set(out)];
}

/* Bottom-sheet editor for one slot */
function openSlotEditor(wk, day, kind, label){
  let fields, src = '', pool;
  if (kind === 'range') {
    const r = day.ranges.find(x => x.range === label);
    fields = [['emp', 'APO', r.emp], ['rmk', 'Remark (WD, AM, PM, M, CXL, EXT = extended hours 1200hrs, EXT 1300 = other time)', r.rmk]];
    src = [r.sup && 'Officer ' + r.sup, r.tf && 'TF ' + r.tf, r.unit && 'Unit ' + r.unit].filter(Boolean).join('  |  ');
    src = src ? src + '<br>Officer, TF and unit come from Initial Recce and stay as they are.' : 'No officer booked from Initial Recce for this range yet.';
    pool = 'APO';
  } else if (kind === 'duty') {
    const x = day.duties.find(y => y.duty === label);
    fields = [['main', 'Main', x.main], ['spare', 'Spare', x.spare]];
    pool = 'APO';
  } else {
    const m = day.medics.find(y => y.role === label);
    fields = [['name', 'Name', m.who], ['loc', 'Location', m.loc]];
    pool = 'Medic';
  }
  const who = fields[0][0];
  const free = freeOn(day, pool);
  const freeMg = freeOn(day, pool === 'Medic' ? 'Backup Medic' : 'Manager');   // the reserve for this kind of slot
  const names = namesFor(pool);
  const bg = document.createElement('div');
  bg.className = 'sheet-bg';
  bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="ed-t">
    <h3 id="ed-t">${esc(label)}, ${nice(day.date)}</h3>
    <div class="src">${src}</div>
    ${fields.map(([k, l, v]) => `<label class="f"><span>${esc(l)}</span><input type="text" id="ed-${k}" value="${esc(v)}" ${k === who ? 'list="ed-names"' : ''} autocomplete="off"></label>` +
      (k === who ? `<label class="f" style="margin-top:-6px"><span class="small muted" style="font-weight:600">Or choose from the list</span><select id="ed-pick"><option value="">Choose a name</option>${pickerOptions(day, pool)}</select></label>` : '')).join('')}
    <datalist id="ed-names">${names.map(n => `<option value="${esc(n)}">`).join('')}</datalist>
    <div id="ed-warn"></div>
    ${free.length ? `<p class="small muted" style="margin:0 0 6px">Undeployed that day. Tap to fill in:</p><div class="chips">${free.map(n => `<button class="chip" data-n="${esc(n)}">${esc(n)}</button>`).join('')}</div>` : ''}
    ${freeMg.length ? `<p class="small muted" style="margin:10px 0 6px">${pool === 'Medic' ? 'Backup medics' : 'Managers (reserve)'}:</p><div class="chips">${freeMg.map(n => `<button class="chip" data-n="${esc(n)}">${esc(n)}</button>`).join('')}</div>` : ''}
    <p class="small muted" style="margin-top:10px">Combos like "ONG / JAMES" are fine. Leave blank to clear the slot.</p>
    ${namesIn(fields[0][2]).length ? `<button class="btn ghost block" id="ed-abs" style="margin-top:12px">Absent today (MC or urgent leave)? Mark and replace</button>` : ''}
    <div class="acts"><button class="btn ghost" id="ed-x">Cancel</button>${fields[0][2] ? '<button class="btn no" id="ed-un">Undeploy</button>' : ''}<button class="btn" id="ed-ok">Save</button></div></div>`;
  document.body.appendChild(bg);
  const inp = $('#ed-' + who, bg);
  const warn = () => {
    const w = clashes(day, inp.value, kind, label, who);
    $('#ed-warn', bg).innerHTML = w.length ? `<div class="note red"><b>Check this:</b><ul style="margin:4px 0 0;padding-left:18px">${w.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : '';
  };
  inp.oninput = warn; warn();
  $('#ed-pick', bg).onchange = e => { if (e.target.value) { inp.value = e.target.value; e.target.value = ''; warn(); } };
  bg.querySelectorAll('[data-n]').forEach(c => c.onclick = () => { inp.value = c.dataset.n; warn(); });
  const close = () => bg.remove();
  $('#ed-x', bg).onclick = close;
  bg.onclick = e => { if (e.target === bg) close(); };
  if ($('#ed-abs', bg)) $('#ed-abs', bg).onclick = () => {
    close();
    openAbsent({ day, candidates: namesIn(fields[0][2]), onDone: w => drawBoard(w) });
  };
  if ($('#ed-un', bg)) $('#ed-un', bg).onclick = () => {
    if (!confirm('Take ' + fields[0][2] + ' off ' + label + ' on ' + nice(day.date) + '?')) return;
    inp.value = '';
    $('#ed-ok', bg).click();
  };
  $('#ed-ok', bg).onclick = async e => {
    busy(e.target, true);
    let week = wk, warnings = [];
    try {
      for (const [k, , v] of fields) {
        const nv = $('#ed-' + k, bg).value.trim().toUpperCase();
        if (nv === String(v || '').toUpperCase()) continue;
        const res = await call('adminSetSlot', S.token, day.date, { kind, label, field:k }, nv);
        week = res.week; warnings = warnings.concat(res.warnings || []);
      }
      S.cache[week.monday] = week;
      close();
      drawBoard(week);
      toast(warnings.length ? 'Saved. ' + warnings.join('. ') : (inp.value ? 'Saved to ' : 'Undeployed. Updated ') + (week.sheet || 'the weekly tab'), !!warnings.length);
    } catch(x){ fail(x); busy(e.target, false); }
  };
  inp.focus();
}

/* ---------- WhatsApp daily message ---------- */
/* Extended hours: "EXT" in a range's RMK. "EXT 1300" = report at 1300hrs, plain "EXT" = 1200hrs. */
function extOf(rmk){
  const t = String(rmk || '').toUpperCase();
  if (!/(^|[^A-Z])EXT([^A-Z]|$)/.test(t)) return '';
  const m = /(\d{1,2})[:.]?(\d{2})/.exec(t);
  if (!m || Number(m[1]) > 23 || Number(m[2]) > 59) return '12:00';
  return (m[1].length < 2 ? '0' : '') + m[1] + ':' + m[2];
}
function rmkNoExt(rmk){
  return String(rmk || '').replace(/(^|[^A-Za-z])EXT([^A-Za-z]|$)/i, '$1$2').replace(/\d{1,2}[:.]?\d{2}\s*(HRS)?/i, '').replace(/\s+/g, ' ').trim();
}
const hrs = hm => String(hm || '').replace(':', '') + 'hrs';
/* { '12:00': [names] } from the day's report times (OTHERS "... 1200HRS" and EXT ranges) */
function reportGroups(day){
  const rp = day.report || {}, g = {};
  Object.keys(rp).forEach(n => { (g[rp[n]] = g[rp[n]] || []).push(n); });
  return Object.keys(g).sort().map(t => ({ t, names: g[t] }));
}
/* Takes medics out of a leave cell without losing others joined to them with "&" */
function dropMedics(text, isMedic){
  return String(text || '').split(/\s*,\s*/).map(part => isMedic(part)
    ? part.split(/\s+(?:&|AND)\s+/i).filter(x => !isMedic(x)).join(' & ') : part).filter(Boolean).join(', ');
}
function waText(day){
  const L = [], b = t => '*' + t + '*';
  const dt = pd(day.date);
  const note = day.title && /\(/.test(day.title) ? ' ' + day.title.replace(/^\w+\s*/, '') : '';
  L.push(b('DEPLOYMENT - ' + ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'][dowIdx(day.date)].toUpperCase() + ', ' + dt.getDate() + ' ' + MONL[dt.getMonth()].toUpperCase() + ' ' + dt.getFullYear()) + note);
  const rs = day.ranges.filter(r => r.active);
  L.push('', b('RANGES'));
  if (!rs.length) L.push('No ranges in use');
  rs.forEach((r, i) => {
    if (i) L.push('');                                    // blank line between ranges
    const ext = extOf(r.rmk);
    L.push(b(r.range) + ' - ' + (r.emp ? b(r.emp) : 'No APO') + (ext ? ' ' + b('(EXT ' + hrs(ext) + ')') : '') + (r.sup ? ' (with ' + r.sup + ')' : ''));
    const dur = r.dur && r.dur !== r.tf ? r.dur : '';   // the sheet sometimes repeats the TF here
    const d = [r.tf, r.unit, [dur, ext ? rmkNoExt(r.rmk) : r.rmk].filter(Boolean).join(' ')].filter(Boolean).join(' | ');
    if (d) L.push('    ' + d);
  });
  const du = day.duties.filter(x => x.main || x.spare);
  if (du.length) {
    L.push('', b('DUTIES'));
    du.forEach(x => L.push(x.duty + ' - ' + (x.main || '-') + (x.spare ? ' (Spare: ' + x.spare + ')' : '')));
  }
  const rp = day.report || {};
  const freeA = freeOn(day, 'APO').map(n => n + (rp[n] ? ' (' + hrs(rp[n]) + ')' : ''));
  L.push('', b('UNDEPLOYED APO'), freeA.length ? freeA.join(', ') : 'NIL');
  const rg = reportGroups(day);
  if (rg.length) { L.push('', b('EXT HOURS')); rg.forEach(g => L.push(hrs(g.t).toUpperCase() + ' - ' + g.names.join(', '))); }
  const medics = (S.staff || []).filter(p => p.role === 'Medic' || p.role === 'Backup Medic').map(p => p.name);
  const aw = day.absences.filter(a => !NOT_AWAY.includes(a.label.toUpperCase().replace(/\s+/g, '')))
    .map(a => ({ label:a.label, text:dropMedics(a.text, x => namesIn(x).some(n => medics.includes(n))) }))
    .filter(a => a.text);
  if (aw.length) {
    L.push('', b('AWAY'));
    aw.forEach(a => L.push(a.label + ' - ' + a.text));
  }
  return L.join('\n');
}

/* ---------- same-day absence: mark away and hand over postings ---------- */
function postingsOf(day, name){
  const out = [];
  day.ranges.forEach(r => { if (r.people.includes(name)) out.push({ slot:{ kind:'range', label:r.range, field:'emp' }, text:r.emp, title:r.range }); });
  day.duties.forEach(x => {
    if (x.mainPeople.includes(name)) out.push({ slot:{ kind:'duty', label:x.duty, field:'main' }, text:x.main, title:x.duty + ' main' });
    if (x.sparePeople.includes(name)) out.push({ slot:{ kind:'duty', label:x.duty, field:'spare' }, text:x.spare, title:x.duty + ' spare' });
  });
  day.medics.forEach(m => { if (m.people.includes(name)) out.push({ slot:{ kind:'medic', label:m.role, field:'name' }, text:m.who, title:m.role }); });
  return out;
}
/* Swap one person inside a cell like "CHEW / JAMES", keeping the others */
function swapName(text, name, repl){
  const parts = String(text || '').split(/\s*(\/|&|,)\s*/);
  const out = []; let done = false;
  for (let i = 0; i < parts.length; i += 2) {
    const tok = parts[i], sep = i ? parts[i-1] : '';
    if (!done && namesIn(tok).includes(name)) { done = true; if (repl) out.push([sep, repl.toUpperCase()]); }
    else if (tok) out.push([sep, tok]);
  }
  return out.map((p, i) => (i ? ' ' + (p[0] || '/') + ' ' : '') + p[1]).join('').trim();
}

          return `<div class="sec" style="margin:-4px 0 10px;padding:10px 12px">
            <div style="font:700 18px var(--cond)">${esc(p.title)} <span class="small muted" style="font-family:var(--body);font-weight:400">now ${esc(p.text)}</span></div>
            <select data-repsel="${i}" style="margin-top:6px"><option value="">${rep ? 'Change: ' + esc(rep) : 'Replace ' + esc(st.name) + ' with\u2026'}</option>${pickerOptions(day, pool, [st.name])}</select>
            <input type="text" data-rep="${i}" list="ab-names" value="${esc(rep)}" placeholder="or type a name" autocomplete="off" style="margin-top:6px">

    });
    $('#ab-ok', bg).onclick = async e => {
      busy(e.target, true);

      } catch(x){ fail(x); busy(e.target, false); }
    };
  };
  const keep = () => { if ($('#ab-r', bg)) st.remark = $('#ab-r', bg).value; };
  bg.onclick = e => { if (e.target === bg) close(); };
  draw();
}

async function admPending(){
  A().innerHTML = '<div class="loading">Loading\u2026</div>';
  try {
    const list = await call('adminPending', S.token);
    const dot = $('#pcount'); if (dot) { dot.hidden = !list.length; dot.textContent = list.length; }
    if (!list.length) { A().innerHTML = `<div class="sec"><p>Nothing waiting. New requests land here.</p></div>`; return; }
    A().innerHTML = list.map(r => `<div class="req" id="q-${esc(r.id)}">
      <div class="h"><b>${esc(r.name)}: ${esc(r.typeLabel)}</b><span class="pill Pending">Pending</span></div>
      <div class="when">${span(r.start, r.end)}${r.session && r.session !== 'Full' ? ' ('+r.session+')' : ''}, ${fmtN(r.days)} day${r.days===1?'':'s'}${r.time ? ', '+esc(r.time) : ''}</div>
      ${r.reason ? `<div class="small">${esc(r.reason)}</div>` : ''}
      ${r.oilDates && r.oilDates.length ? `<div class="small muted">Clearing OIL earned on ${r.oilDates.map(nice).join(', ')}</div>` : ''}
      ${r.attachment ? `<div class="small"><a href="${esc(r.attachment)}" target="_blank" rel="noopener">View attachment</a></div>` : ''}
      ${r.warnings.length ? `<div class="note red" style="margin:8px 0 0"><b>On the roster:</b><ul>${r.warnings.map(w => `<li>${wdate(w)}</li>`).join('')}</ul></div>` : ''}
      ${r.othersAway.length ? `<div class="note" style="margin:8px 0 0"><b>Also away:</b><ul>${r.othersAway.map(w => `<li>${esc(w.replace(/\d{4}-\d{2}-\d{2}/g, m => nice(m)))}</li>`).join('')}</ul></div>` : ''}
      <div class="acts"><input type="text" placeholder="Remark (optional)" data-rm="${esc(r.id)}">
        <button class="btn go" data-ok="${esc(r.id)}">Approve</button>
        ${r.warnings.length && r.type !== 'OIL' ? `<button class="btn ghost" data-rep="${esc(r.id)}">Approve and replace</button>` : ''}
        <button class="btn no" data-no="${esc(r.id)}">Reject</button></div></div>`).join('');
    const decide = async (id, ok, btn) => {
      busy(btn, true);
      try {
        const res = await call('adminDecide', S.token, id, ok, $(`[data-rm="${id}"]`).value);
        const miss = (res.notWritten || []).map(w => w.error).join('; ');
        toast(res.status + (miss ? '. Not written to sheet: ' + miss : ''), !!miss);
        S.cache = {}; admPending();
      } catch(e){ fail(e); busy(btn, false); }
    };
    document.querySelectorAll('[data-ok]').forEach(b => b.onclick = () => decide(b.dataset.ok, true, b));
    document.querySelectorAll('[data-no]').forEach(b => b.onclick = () => decide(b.dataset.no, false, b));
    document.querySelectorAll('[data-rep]').forEach(b => b.onclick = async () => {
      const r = list.find(x => x.id === b.dataset.rep);
      const first = (r.warnings[0] || '').slice(0, 10) || r.start;
      busy(b, true);
      try {
        const m = mondayOf(first);
        const wk = S.cache[m] || await call('getWeek', S.token, first);
        S.cache[m] = wk;
        busy(b, false);
        if (!wk.days.length) return toast('No weekly tab for that week yet.', true);

      } catch(e){ fail(e); busy(b, false); }
    });
  } catch(e){ fail(e); }
}

/* ---------- Attendance ---------- */
const ATT_AWAY = ['UL','AL','NPL','MC','MA','HL','CCL','OIL','Course','ICT','Others'];
const MON_ATT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sept','Oct','Nov','Dec'];
const DAYL = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const titleCase = n => n.toLowerCase().replace(/(^|[\s(\/-])([a-z])/g, (m, a, c) => a + c.toUpperCase());
function attText(a){
  const d = pd(a.date);
  const rows = a.rows.filter(r => r.status !== 'Off');
  const list = arr => arr.length ? arr.length + ' - ' + arr.map(r => titleCase(r.name)).join(', ') : 'NIL';
  const by = st => rows.filter(r => r.status === st);
  const present = rows.filter(r => r.status === 'Present' || r.status === 'Present (Late)');
  const head2 = ['*OPS SUPPORT*',
    '*Date: ' + d.getDate() + ' ' + MON_ATT[d.getMonth()] + ' ' + d.getFullYear() + ' (' + DAYL[dowIdx(a.date)] + ')*',
    'Total strength: ' + rows.length];
  if (dowIdx(a.date) >= 5) {
    // Weekend: only who is turning up, Managers first (JAMES LAI first), then APO, then Medics
    const ORD = { Manager:0, APO:1, Medic:2 };
    const ppl = present.slice().sort((x, y) => ((ORD[x.role] ?? 3) - (ORD[y.role] ?? 3)) ||
      ((y.name === 'JAMES LAI') - (x.name === 'JAMES LAI')) || x.name.localeCompare(y.name));
    return head2.concat(['Present: ' + ppl.length], ppl.map(r => titleCase(r.name))).join('\n');
  }
  const L = [
    '*OPS SUPPORT*',
    '*Date: ' + d.getDate() + ' ' + MON_ATT[d.getMonth()] + ' ' + d.getFullYear() + ' (' + DAYL[dowIdx(a.date)] + ')*',
    'Total strength: ' + rows.length,
    'Present: ' + present.length,
    'Present (Late): ' + list(by('Present (Late)')),
    ''
  ];
  ATT_AWAY.forEach(c => L.push(c + ': ' + list(by(c))));
  const none = rows.filter(r => !r.status);
  if (none.length) L.push('Not accounted: ' + list(none));
  return L.join('\n');
}

async function admLib(){
  A().innerHTML = '<div class="loading">Loading\u2026</div>';

const LIB_MONTHS = 6;   // LIB is valid for 6 months from the test date
/* add n months to a yyyy-mm-dd date, keeping month ends (31 Aug + 6 = 28 Feb) */
const addMonths = (d, n) => { const x = pd(d), day = x.getDate(); x.setDate(1); x.setMonth(x.getMonth() + n);
  x.setDate(Math.min(day, new Date(x.getFullYear(), x.getMonth() + 1, 0).getDate())); return ymd(x); };
function drawLib(list){
  const days = d => d ? Math.round((pd(d) - pd(S.today)) / 864e5) : null;
  const pill = d => {
    const n = days(d);
    if (n == null) return '<span class="pill Cancelled">No date</span>';
    if (n < 0) return '<span class="pill Rejected">Expired</span>';
    if (n <= 45) return `<span class="pill Pending">${n} day${n === 1 ? '' : 's'} left</span>`;
    return '<span class="pill Approved">Valid</span>';
  };
  list = list.slice().sort((a, b) => (a.date || '9999') < (b.date || '9999') ? -1 : 1);
  const have = list.map(x => x.name);
  const missing = (S.staff || []).filter(p => (p.role === 'APO' || p.role === 'Manager') && !have.includes(p.name)).map(p => p.name).sort();
  const late = list.filter(x => days(x.date) != null && days(x.date) < 0).length;
  const small = 'min-height:36px;padding:4px 10px;font-size:14px';
  A().innerHTML = `
    <p class="small muted">Enter the date each person <b>took the LIB test</b>. The expiry is set to six months later and saved in the <b>Database</b> tab (column H), which the LIB EXPIRY list on every weekly tab reads.</p>
    ${late ? `<div class="note red">${late} LIB${late === 1 ? ' has' : 's have'} expired.</div>` : ''}
    <div class="scroll"><table class="t"><tr><th>Name and expiry</th><th>LIB test taken</th></tr>
      ${list.map(x => `<tr><td><b>${esc(x.label)}</b>
          <div class="small" style="margin-top:4px;white-space:nowrap">Expires ${x.date ? nice(x.date) + ' ' + pd(x.date).getFullYear() : '-'}</div>
          <div style="margin-top:4px">${pill(x.date)}</div></td>
        <td><input type="date" value="${x.date ? addMonths(x.date, -LIB_MONTHS) : ''}" max="${S.today}" data-libd="${esc(x.name)}" style="min-height:38px;padding:6px 8px;max-width:160px">
          <div class="small muted" data-libx="${esc(x.name)}" style="margin-top:4px"></div>
          <div style="margin-top:6px;display:flex;gap:6px"><button class="btn" style="${small}" data-libsave="${esc(x.name)}">Save</button>
          <button class="btn ghost" style="${small}" data-librm="${x.row}" data-libname="${esc(x.name)}">Remove</button></div></td></tr>`).join('')}</table></div>
    <div class="sec" style="margin-top:16px"><h3 style="margin-top:0">Add someone to the LIB list</h3>
      ${missing.length ? `<label class="f"><span>Name</span><select id="l-n"><option value="">Choose a name</option>${missing.map(n => `<option>${esc(n)}</option>`).join('')}</select></label>
      <label class="f"><span>Date they took the LIB test</span><input type="date" id="l-d" max="${S.today}"></label>
      <p class="small muted" id="l-x" style="margin-top:-8px"></p>
      <button class="btn" id="l-go">Add to LIB list</button>` : '<p class="muted">Every APO and manager is already on the list.</p>'}</div>`;
  // live preview of the new expiry as the test date changes
  A().querySelectorAll('[data-libd]').forEach(inp => inp.oninput = () => {
    const out = A().querySelector(`[data-libx="${inp.dataset.libd}"]`);
    out.textContent = inp.value ? 'New expiry: ' + nice(addMonths(inp.value, LIB_MONTHS)) + ' ' + addMonths(inp.value, LIB_MONTHS).slice(0, 4) : '';
  });
  if ($('#l-d')) $('#l-d').oninput = () => { const v = $('#l-d').value; $('#l-x').textContent = v ? 'Expires ' + nice(addMonths(v, LIB_MONTHS)) + ' ' + addMonths(v, LIB_MONTHS).slice(0, 4) : ''; };
  const save = async (name, testDate, btn) => {
    busy(btn, true);
    try { drawLib(await call('adminSetLib', S.token, { name, testDate })); toast('LIB saved for ' + name + '. Expires ' + nice(addMonths(testDate, LIB_MONTHS)) + ' ' + addMonths(testDate, LIB_MONTHS).slice(0, 4)); }
    catch(x){ fail(x); busy(btn, false); }
  };
  A().querySelectorAll('[data-libsave]').forEach(b => b.onclick = () => save(b.dataset.libsave, A().querySelector(`[data-libd="${b.dataset.libsave}"]`).value, b));
  A().querySelectorAll('[data-librm]').forEach(b => b.onclick = async () => {
    if (!confirm('Remove ' + b.dataset.libname + ' from the LIB list?')) return;

  };
}

  }
