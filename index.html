  let lateAfter = '07:45';
  /* preview: training + birthdays from the tracker */
  const MB = { FAIZAL:'1981-05-05', WONG:'1989-10-21', DANIAL:'1995-10-02', CHEW:'1976-09-24', LIM:'1968-05-19', FAIRUZ:'1980-06-24', LEONARD:'1987-06-09', ONG:'1992-12-03', TOH:'1993-02-16', ARIF:'1984-05-02' };
  const MID = { FAIZAL:'24965', WONG:'97780', DANIAL:'144316', CHEW:'42347', LIM:'16356', FAIRUZ:'21004', LEONARD:'34627', ONG:'120564', TOH:'90305', ARIF:'171590' };
  const TDF = [{ k:'WHT1', t:'WHT', label:'WHT (Jan-Jun)', half:1 }, { k:'WHT2', t:'WHT', label:'WHT (Jul-Dec)', half:2 }, { k:'PCT', t:'PCT', label:'PCT' },
    { k:'TS', t:'TS', label:'TS' }, { k:'TESTTS', t:'TEST TS', label:'TEST TS', needs:'TS' }, { k:'MA', t:'MA', label:'MA Checkup', minAge:35, doneWord:'DONE' }, { k:'IPPT', t:'IPPT', label:'IPPT', ippt:true }];
  const mPer = (d, td) => { const y = +td.slice(0,4), m = +td.slice(5,7);
    if (d.half) return d.half === 1 ? { id:y+'-H1', start:y+'-01-01', end:y+'-06-30' } : { id:y+'-H2', start:y+'-07-01', end:y+'-12-31' };
    if (d.ippt) { const sy = m >= 4 ? y : y - 1; return { id:String(sy), start:sy+'-04-01', end:(sy+1)+'-03-31' }; }
    return { id:String(y), start:y+'-01-01', end:y+'-12-31' }; };
  const mAge = b => { if (!b) return null; let a = +today.slice(0,4) - +b.slice(0,4); if (today.slice(5) < b.slice(5)) a--; return a; };
  const mrows = []; let mid = 0;
  [['FAIZAL','2026-04-24','2026-09-25','2026-04-18','2026-07-21','','','2026-06-30','2026-09-01'],['WONG','2026-04-24','2026-07-08','2026-07-09','2026-05-04','2026-09-24','','2026-06-30','2026-09-25'],
   ['DANIAL','2026-04-24','2026-09-11','2026-05-12','2026-05-05','','2026-10-06','','2026-09-20'],['CHEW','2026-04-24','2026-09-11','2026-05-12','2026-05-06','2026-09-22','','',''],
   ['LIM','2026-04-24','2026-09-25','2026-08-06','2026-08-12','','','2026-06-30','2026-08-27'],['FAIRUZ','2026-04-24','2026-09-25','2026-04-18','2026-08-06','','','',''],
   ['LEONARD','2026-04-24','2026-09-04','2026-06-09','2026-06-30','2026-09-10','','2026-06-30','2026-09-18'],['ONG','2026-04-24','2026-07-24','2026-08-11','2026-08-31','','','','2026-09-07'],
   ['TOH','2026-04-24','2026-09-21','2026-04-18','2026-08-19','','','','2026-09-25'],['ARIF','2026-04-24','2026-09-11','2026-04-18','2026-09-18','','','2026-06-30','']].forEach(x => {
    const put = (k, dt, arrOnly) => { if (!dt) return; const d = TDF.find(z => z.k === k), done = !arrOnly && dt <= today;
      mrows.push({ id:'M' + (++mid), name:x[0], t:d.t, period:mPer(d, dt).id, arranged:dt, result: done ? (d.doneWord || 'PASSED') : '', resultDate: done ? dt : '' }); };
    put('WHT1', x[1]); put('WHT2', x[2]); put('PCT', x[3]); put('TS', x[4]); put('TESTTS', x[5]); put('TESTTS', x[6], true); put('MA', x[7]); put('IPPT', x[8]); });
  function mTrn(){
    const apos = (S.staff || []).filter(p => p.role === 'APO' && MB[p.name]);
    const mine = canManage() ? apos : apos.filter(p => p.name === S.me.name);
    const periods = TDF.map(d => Object.assign({ k:d.k, t:d.t, label:d.label, needs:d.needs || '', minAge:d.minAge || 0, doneWord:d.doneWord || 'PASSED' }, mPer(d, today)));
    const keys = {}; periods.forEach(p => { keys[p.t + '|' + p.id] = 1; });
    const names = mine.map(p => p.name);
    return { today, canEdit: canManage(), periods, people: mine.map(p => ({ name:p.name, sid:MID[p.name] || '', age:mAge(MB[p.name]) })),
      rows: mrows.filter(r => names.includes(r.name) && keys[r.t + '|' + r.period]) };
  }
  const mBdays = () => Object.keys(MB).filter(n => MB[n].slice(5) === today.slice(5));
  const inspM = [{ id:'biweekly', name:'Bi-Weekly CAS', every:'2w', last:'' }, { id:'monthly', name:'Monthly OHS & Office Security', every:'month', last:'' }];
  function mockInsp(){
    const dd = (a, b) => Math.round((pd(b) - pd(a)) / 86400000);
    return inspM.map(x => {
      let due = '', w = 0;
      if (x.every === '2w') { w = 3; if (!x.last) return Object.assign({}, x, { state:'unset', due:'', days:null }); due = addD(x.last, 14); }
      else { w = 7; const t = pd(x.last || today); let y = t.getFullYear(), m = t.getMonth() + (x.last ? 1 : 0); if (m > 11) { m = 0; y++; }
        const e = new Date(y, m + 1, 0); due = ymd(e); }
      const days = dd(today, due);
      return Object.assign({}, x, { due, days, state: days < 0 ? 'overdue' : days === 0 ? 'due' : days <= w ? 'soon' : 'ok' });
    });
  }
  const attStore = {};
  const attRec = (d, n) => { const k = d + '|' + n; return attStore[k] || (attStore[k] = { clockIn:'', status:'' }); };
  const ATT_ROWS = { AL:'AL', UL:'UL', MC:'MC', OIL:'OIL', HL:'HL', CCL:'CCL', ICT:'ICT', COURSE:'Course', COMPASSIONATELEAVE:'Others', OTHERS:'Others' };
  function mockLeave(d){
    const out = {}, wk = getWk(mondayOf(d)), day = wk.days && wk.days[dowIdx(d)];
    if (!day) return out;
    day.absences.forEach(a => {
      const cat = ATT_ROWS[a.label.toUpperCase().replace(/\s+/g, '')]; if (!cat) return;
      a.text.split(/\s*,\s*/).forEach(part => namesIn(part).forEach(n => {
        if (out[n]) return;
        const w = ' ' + part.toUpperCase().replace(/[^A-Z]+/g, ' ') + ' ';
        let c = cat;
        if (/ NPL /.test(w)) c = 'NPL'; else if (/ MA /.test(w)) c = 'MA'; else if (/ MC /.test(w)) c = 'MC';
        else if (cat === 'Others') { if (/ AL /.test(w)) c = 'AL'; else if (/ UL /.test(w)) c = 'UL'; else if (/ HL /.test(w)) c = 'HL'; else if (!/ LEAVE /.test(w)) return; }
        out[n] = { cat:c, text:part };
      }));
    });
    return out;
  }
  function mockMyAtt(n){ const r = attRec(today, n); return { date:today, clockIn:r.clockIn, status:r.status, late: !!r.clockIn && r.clockIn > lateAfter, leave: mockLeave(today)[n] || null, lateAfter }; }
  function mockAtt(d){
    d = d || today; const lv = mockLeave(d);
    if (d === today && !attStore.__seeded) {           // pretend most people clocked in this morning
      attStore.__seeded = 1;
      staffList.filter(p => p.role !== 'Admin').forEach((p, i) => { if (!lv[p.name] && i % 7 !== 3) attRec(d, p.name).clockIn = i % 9 === 5 ? '08:14' : '07:4' + (i % 10); });
    }
    const rows = staffList.filter(p => p.role !== 'Admin' && p.role !== 'Backup Medic' && p.active && p.att !== false).map(p => {
      const r = attRec(d, p.name); let status = '';
      if (r.status) status = r.status; else if (r.clockIn) status = r.clockIn > lateAfter ? 'Present (Late)' : 'Present'; else if (lv[p.name]) status = lv[p.name].cat;
      return { name:p.name, role:p.role, clockIn:r.clockIn, by:r.by || '', override:r.status, leave:lv[p.name] || null, status };
    });
    return { date:d, lateAfter, statuses:['Present','Present (Late)','UL','AL','NPL','MC','MA','HL','CCL','OIL','Course','ICT','Others','Off'], rows };
  }
  const libList = Object.keys(SNAP.lib).map((n, i) => ({ row: i + 2, label: n, name: n, date: SNAP.lib[n] }));
  const reqs = [{ id:'R1', submitted:today+' 09:10', name:'LEONARD', type:'AL', typeLabel:'Annual leave', start:addD(today, 9), end:addD(today, 10), session:'Full', days:2, reason:'Family trip', status:'Pending', warnings:[addD(today, 9)+': rostered 100M1 (with Teo BL)'], othersAway:['FAIRUZ AL '+addD(today,10)] }];
  const types = [['AL','Annual leave'],['OIL','Off day (OIL)'],['MA','Medical appointment'],['MC','Medical leave (MC)'],['HL','Hospitalisation leave'],['UL','Urgent leave'],['CL','Compassionate leave'],['COURSE','Course'],['TRG','IPPT / training / test'],['OTHERS','Others']]
    .filter(([code]) => ['AL','OIL','MA'].includes(code))
    .map(([code, label]) => ({ code, label, needsReason:['COURSE','TRG','OTHERS','CL'].includes(code), attach:['MC','MA','HL','CL'].includes(code) }));
  const O = (name, label, no, date, activity, taken, tts, notes, remaining, dateText) => ({ id:name+'#'+no, name, label, no:String(no), date:date||'', dateText:dateText||'', activity, taken:taken||'', tts:tts||'', notes:notes||'', remaining, reserved:0, available:remaining, needsTts: !!taken && !tts });
  const oil = JSON.parse(JSON.stringify(SNAP.oil));
  return {
    getLoginInfo: () => ({ auto:null }),
    login: (n, p) => { if (!/^\d{4,6}$/.test(p)) throw new Error('PIN must be 4 to 6 digits.');
      n = String(n || '').trim().toUpperCase();
      const who = staffList.find(x => x.name === n) || staffList.find(x => (x.aliases || []).includes(n));
      if (!who) throw new Error('Name or PIN is wrong.');
      n = who.name;
      const role = who ? who.role : 'APO';
      return { token:'demo', me:{ name:n, role }, types: types.filter(t => t.code !== 'OIL' || role !== 'Admin'), today, staff: staffList.filter(p => p.active) }; },
    getHome: () => ({ me:S.me, balances:{ oilAvailable:oil.filter(o=>o.name===S.me.name).reduce((a,o)=>a+o.available,0), oilReserved:0, pending:1 },
      lib: SNAP.lib[S.me.name] || null, upcoming: mockSched(today, 14),
      attendance: S.me.role === 'Admin' ? null : mockMyAtt(S.me.name), inspections: canManage() ? mockInsp() : null,
      birthdays: mBdays(), sid: MID[S.me.name] || '', training: S.me.role === 'APO' ? mTrn() : null }),
    clockIn: () => { const t = new Date(); const hm = String(t.getHours()).padStart(2,'0') + ':' + String(t.getMinutes()).padStart(2,'0');
      const r = attRec(today, S.me.name); if (!r.clockIn) r.clockIn = hm; return mockMyAtt(S.me.name); },
    adminAttendance: (t, d) => mockAtt(d),
    getInspections: () => mockInsp(),
    getTraining: () => mTrn(),
    getBirthdays: () => mBdays(),
    trainingArrange: (t, f) => { const d = TDF.find(z => z.k === f.k), per = mPer(d, today);
      const open = mrows.filter(r => r.name === f.name && r.t === d.t && r.period === per.id && !r.result).pop();
      if (open && !f.date) mrows.splice(mrows.indexOf(open), 1); else if (open) open.arranged = f.date;
      else if (f.date) mrows.push({ id:'M' + (++mid), name:f.name, t:d.t, period:per.id, arranged:f.date, result:'', resultDate:'' });
      else throw new Error('Pick a date.'); return mTrn(); },
    trainingResult: (t, f) => { if (f.id) { const r = mrows.find(x => x.id === f.id); r.result = f.result; r.resultDate = f.result ? r.arranged : ''; }
      else { const d = TDF.find(z => z.k === f.k); mrows.push({ id:'M' + (++mid), name:f.name, t:d.t, period:mPer(d, f.date).id, arranged:f.date, result:f.result, resultDate:f.date }); }
      return mTrn(); },
    inspectionDone: (t, id, d) => { const x = inspM.find(i => i.id === id); x.last = d || today; return mockInsp(); },
    inspectionEdit: (t, id, f) => { const x = inspM.find(i => i.id === id); if (f.name) x.name = f.name; if (f.last != null) x.last = f.last; return mockInsp(); },
    adminSetAttendance: (t, d, n, st) => { attRec(d, n).status = st; return Object.assign(mockAtt(d), { warn:'' }); },
    adminSetLateAfter: (t, hm, d) => { lateAfter = hm; return mockAtt(d); },
    adminClockIn: (t, d, n, hm) => { const r = attRec(d, n); r.clockIn = hm; r.by = hm ? S.me.name : ''; return mockAtt(d); },
    getWeek: (t, d) => getWk(mondayOf(d)),
    getMySchedule: (t, from, to) => mockSched(from, nDays(from, to)),
    adminSetSlot: (t, date, slot, v) => {
      const wk = getWk(mondayOf(date)); const d = wk.days[dowIdx(date)];
      const warnings = ['rmk','loc'].includes(slot.field) ? [] : clashes(d, v, slot.kind, slot.label, slot.field);
      let old = '';
      const ppl = x => namesIn(x);
      if (slot.kind === 'range') { const r = d.ranges.find(x => x.range === slot.label); old = r[slot.field]; r[slot.field] = v; r.people = ppl(r.emp); r.active = !!(r.sup || r.emp); }
      if (slot.kind === 'duty') { const x = d.duties.find(y => y.duty === slot.label); old = x[slot.field]; x[slot.field] = v; x.mainPeople = ppl(x.main); x.sparePeople = ppl(x.spare); }
      if (slot.kind === 'medic') { const m = d.medics.find(y => y.role === slot.label); const f = slot.field === 'name' ? 'who' : 'loc'; old = m[f]; m[f] = v; m.people = ppl(m.who); }
      changes.unshift({ id:'C'+Date.now()+Math.random(), when:today, by:S.me.name, date, slot:slot.label+' '+({emp:'employee',rmk:'remark',name:'',loc:'location'}[slot.field] ?? slot.field), oldValue:old, hadFormula:slot.field==='emp', newValue:v, status:'Done' });
      return { week: JSON.parse(JSON.stringify(wk)), warnings };
    },
    adminMarkAbsent: (t, f) => {
      const wk = getWk(mondayOf(f.date)); const d = wk.days[dowIdx(f.date)];
      if (f.requestId) { const r = reqs.find(x => x.id === f.requestId); if (r) r.status = 'Approved'; }
      const lab = { MC:'MC', UL:'UL', CL:'Compassionate Leave', OTHERS:'OTHERS' }[f.type] || 'MC';
      d.absences.push({ label:lab, text: f.name + ' ' + (f.type === 'MC' || f.type === 'UL' ? f.type : f.remark || ''), people:[f.name] });
      let warnings = [];
      f.changes.forEach(c => { warnings = warnings.concat(MOCK.adminSetSlot(t, f.date, c.slot, c.value).warnings); });
      return { week: JSON.parse(JSON.stringify(wk)), warnings, notWritten:[] };
    },
    adminChanges: () => changes,
    adminUndo: (t, id) => { changes.find(c => c.id === id).status = 'Undone'; return true; },
    adminStaff: () => staffList,
    adminSaveStaff: (t, f) => {
      const name = String(f.name||'').trim().toUpperCase(); if (!name) throw new Error('Enter one name, without / or & or commas.');
      let p = staffList.find(x => x.name === name);
      if (f.isNew) { if (p) throw new Error(name + ' is already in the staff list.'); staffList.push({ name, role:f.role, aliases:f.aliases ? f.aliases.toUpperCase().split(/\s*,\s*/) : [], email:f.email, active:true, hasPin:false }); }
      else Object.assign(p, { role:f.role, aliases:f.aliases ? f.aliases.toUpperCase().split(/\s*,\s*/) : [], email:f.email, active:f.active, att: f.att !== false });
      return { list: staffList, staff: staffList.filter(x => x.active) };
    },
    adminResetPin: () => true,
    changeMyPin: (t, c, n) => { if (!/^\d{4,6}$/.test(n)) throw new Error('The new PIN must be 4 to 6 digits.'); return true; },
    adminSetPin: (t, n, pin) => { if (!/^\d{4,6}$/.test(pin)) throw new Error('The PIN must be 4 to 6 digits.'); const x = staffList.find(y => y.name === n); x.hasPin = true; x.tempPin = true; x.locked = false; return staffList; },
    adminUnlock: (t, n) => { staffList.find(y => y.name === n).locked = false; return staffList; },
    getMyOilHistory: () => oil.filter(o => o.name === S.me.name),
    getMyOil: () => oil.filter(o => o.name === S.me.name && o.available > 0).map(o => ({ id:o.id, date:o.date, label:o.dateText, activity:o.activity, days:o.available })),
    submitRequest: (t, f) => { if (f.type === 'OIL' && !f.oilIds.length) throw new Error('Tick enough earned off days to cover the request.');
      reqs.unshift({ id:'R'+Date.now(), submitted:today, name:S.me.name, type:f.type, typeLabel:types.find(x=>x.code===f.type).label, start:f.start, end:f.end, session:f.session, days:f.start===f.end && f.session!=='Full' ? .5 : nDays(f.start,f.end), reason:f.reason, status:'Pending', warnings:[], othersAway:[] });
      return { id:'R', warnings:[f.start+': rostered 100M1 (with Teo BL)'] }; },
    getMyRequests: () => reqs.filter(r => r.name === S.me.name).concat([{ id:'R0', name:S.me.name, typeLabel:'Medical appointment', start:addD(today,-6), end:addD(today,-6), session:'PM', days:.5, reason:'Polyclinic', status:'Approved', remark:'OK' }]),
    cancelRequest: (t, id) => { const r = reqs.find(x => x.id === id); if (r) r.status = 'Cancelled'; return true; },
    adminPending: () => reqs.filter(r => r.status === 'Pending'),
    adminDecide: (t, id, ok) => { const r = reqs.find(x => x.id === id); r.status = ok ? 'Approved' : 'Rejected'; return { status:r.status, notWritten:[] }; },
    adminTeam: () => staffList.filter(p => p.role !== 'Admin').map(p => ({ name:p.name, role:p.role, oilAvailable: oil.filter(o => o.name === p.name).reduce((a, o) => a + o.available, 0), oilReserved:0, pending: reqs.filter(r => r.name === p.name && r.status === 'Pending').length, lib: SNAP.lib[p.name] || null })),
    adminOil: (t, n) => oil.filter(o => !n || o.name === n),
    adminTtsDone: (t, id) => { const o = oil.find(x => x.id === id); o.tts = 'TTS adjusted on ' + pd(today).getDate() + '/' + (pd(today).getMonth()+1) + '/26'; o.needsTts = false; return true; },
    adminAddOil: (t, f) => {
      if (!f.names || !f.names.length) throw new Error('Tick at least one name.');
      if (!f.date && !f.other) throw new Error('Pick the date it was earned, or type what it is for (e.g. COHESION OIL 2026).');
      const added = [], skipped = [];
      f.names.forEach(nm => {
        const mine = oil.filter(o => o.name === nm);
        if (f.date && mine.some(o => o.date === f.date)) return skipped.push(nm);
        oil.push({ id:nm+'#'+(mine.length+1), name:nm, label:mine[0] ? mine[0].label : nm, no:String(mine.length+1), date:f.date||'', dateText:(f.other||'').toUpperCase(), activity:((f.activities || {})[nm] || f.activity || '').toUpperCase(), taken:'', tts:'', notes:(f.remark||'').toUpperCase(), remaining:1, reserved:0, available:1, needsTts:false });
        added.push(nm);
      });
      return { added, skipped };
    },
    adminLib: () => libList.filter(x => x.label),
    adminSetLib: (t, f) => {
      if (!f.testDate) throw new Error('Pick the date they took the LIB test.');
      if (f.testDate > today) throw new Error('The LIB test date cannot be in the future.');
      f.date = addMonths(f.testDate, LIB_MONTHS);
      let x = libList.find(y => y.name === f.name);
      if (!x) { x = { row: libList.length + 2, label: f.name, name: f.name, date:'' }; libList.push(x); }
      x.date = f.date; SNAP.lib[f.name] = f.date; return libList.filter(y => y.label);
    },
    adminRemoveLib: (t, row, name) => { const i = libList.findIndex(y => y.name === name); if (i >= 0) libList.splice(i, 1); delete SNAP.lib[name]; return libList; },
    adminVoidOil: (t, id) => { oil.splice(oil.findIndex(o => o.id === id), 1); return true; },
    adminScanOil: () => [],
    adminRefresh: () => 152
  };
})();

// used by onclick="\u2026" buttons in the page
window.boot = boot;
window.go = go;
boot();
})();
